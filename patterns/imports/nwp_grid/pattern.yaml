name: nwp_grid
description: |
  Import an NWP gridded forecast (precipitation + temperature) from
  Environment Canada's WCS service. Produces two files: the import
  config (timeSeriesImportRun) and a workflow that runs import +
  preprocess for both parameters.

# Variables the configurator supplies per instantiation.
# Types: str | int | dict
variables:
  nwp_name:
    type: str
    required: true
    description: |
      NWP product name (HRDPS, GDPS, RDPS, REPS, ...). Drives
      moduleInstanceId, locationId, and filenames everywhere it
      appears. Must also be declared as a locationId in
      LocationSets.xml (singleton path handles that).
  time_step_hours:
    type: int
    required: true
    description: |
      Forecast time step in hours. HRDPS=1, RDPS=3, GDPS=3, REPS=6.
  forecast_horizon_hours:
    type: int
    required: true
    description: |
      End of forecast horizon in hours from issue time.
      HRDPS=48, RDPS=84, GDPS=240, REPS=384.
  start_lookback_hours:
    type: int
    default: 1
    description: |
      Hours before issue time the precipitation lookback covers.
      Required because PC.nwp is accumulative and the first frame
      is unavailable. Typically equals time_step_hours.
  expiry_time_days:
    type: int
    default: 7
    description: |
      Days before imported data is treated as stale by FEWS.
  subset_property_kind:
    type: str
    default: bool
    description: |
      XML element type wrapping the subset property — either ``bool``
      or ``string``. Matches the FEWS properties block.
  subset_property_key:
    type: str
    default: useSubset
    description: |
      Key name. Common values: ``useSubset`` (paired with bool false),
      ``subsettingCrs`` (paired with string EPSG:4326).
  subset_property_value:
    type: str
    default: "false"
    description: |
      String form of the value. ``"false"`` for the bool case,
      ``"EPSG:4326"`` for the subsettingCrs case.
  workflow_shape:
    type: str
    default: inline
    description: |
      How the workflow handles preprocessing.
        - inline: 3 inline activities (PC + Accumulate + TA). Used by
          high-resolution products (HRDPS).
        - inline_minimal: 2 inline activities (PC + TA, no Accumulate).
          Used by analysis products (RDPA).
        - delegated: 2 activities that call per-basin child workflows
          ``Preprocess<NWP><MODELNAME>``. Used by lower-resolution
          products (GDPS, RDPS, REPS) that share a downstream pipeline.
        - none: import-only, no preprocess (HRDPA).

# Each output file is rendered by one Jinja template. Output paths can
# reference any variable.
files:
  - template: ImportNWP.xml.j2
    output: ModuleConfigFiles/Import/ECCCGrids/Import{{ nwp_name }}.xml
  - template: ImportNWPGrids.xml.j2
    output: WorkflowFiles/Import/ECCCGrids/Import{{ nwp_name }}Grids.xml

# Cross-spec contributions — values this pattern adds to other files
# the project shares. The expander aggregates these across all
# instantiations and merges into the singleton files.
contributions:
  ModuleInstanceDescriptors.xml:
    - id: Import{{ nwp_name }}
      description: Import {{ nwp_name }} gridded forecast
    - id: Preprocess{{ nwp_name }}
      description: Preprocess {{ nwp_name }} forecast (PC + TA)
  Locations.xml:
    # The NWP grid declares itself as a location (used as locationId
    # in the timeSeriesSet). Singleton Locations.xml gets this row.
    - id: "{{ nwp_name }}"
      name: "{{ nwp_name }} source grid"
      x: 0
      y: 0
