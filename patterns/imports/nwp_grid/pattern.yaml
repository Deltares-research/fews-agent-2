name: nwp_grid
description: |
  Import an NWP gridded forecast (precipitation + temperature) from
  Environment Canada's WCS service. Produces two files: the import
  config (timeSeriesImportRun) and a workflow that runs import +
  preprocess for both parameters.
keywords: [nwp, ecccgrids, weather, forecast, precipitation, temperature, grid]
when_to_use: |
  When importing a numerical weather prediction product as gridded data
  (PC.nwp + TA.nwp) from Environment Canada. Each instance covers one
  NWP product (HRDPS, GDPS, RDPS, REPS, ...).

# Variables the configurator supplies per instantiation. Defaults are
# used when not supplied; required ones must be present.
variables:
  nwp_name:
    type: str
    required: true
  time_step_hours:
    type: int
    required: true
  forecast_horizon_hours:
    type: int
    required: true
  start_lookback_hours:
    type: int
    default: 1
  expiry_time_days:
    type: int
    default: 7
  subset_property_kind:
    type: str
    default: bool
  subset_property_key:
    type: str
    default: useSubset
  subset_property_value:
    type: str
    default: "false"
  workflow_shape:
    type: str
    default: inline

# Each output declares: which Pydantic schema class validates the data,
# the output path (templated), and the data shape (with placeholder
# expressions rendered before validation). The Jinja template is
# looked up from the SPECS registry by schema class — no template
# path declared here.
outputs:
  - schema: TimeSeriesImportRun
    output: ModuleConfigFiles/Import/ECCCGrids/Import{{ nwp_name }}.xml
    data:
      import:
        - general:
            importType: CanadaMeteoWCS
            serverUrl: https://geo.weather.gc.ca/geomet?SERVICE=WCS&VERSION=2.0.1&REQUEST=GetCoverage
            relativeViewPeriod:
              unit: hour
              start: "{{ start_lookback_hours }}"
              end: "{{ forecast_horizon_hours }}"
              startOverrulable: true
              endOverrulable: true
            idMapId: IdImportCanadaWCS
          startTimeShift:
            parameterId: PC.nwp
            relativePeriod:
              unit: hour
              start: "-{{ start_lookback_hours }}"
              end: 0
          properties:
            "{{ subset_property_kind }}":
              - key: "{{ subset_property_key }}"
                value: "{{ subset_property_value }}"
          timeSeriesSet:
            - moduleInstanceId: Import{{ nwp_name }}
              valueType: grid
              parameterId: PC.nwp
              locationId: "{{ nwp_name }}"
              timeSeriesType: external forecasting
              timeStep:
                unit: hour
                multiplier: "{{ time_step_hours }}"
              readWriteMode: add originals
          externUnit:
            - parameterId: PC.nwp
              unit: kg m-2
              cumulativeSum: true
        - general:
            importType: CanadaMeteoWCS
            serverUrl: https://geo.weather.gc.ca/geomet?SERVICE=WCS&VERSION=2.0.1&REQUEST=GetCoverage
            relativeViewPeriod:
              unit: hour
              start: 0
              end: "{{ forecast_horizon_hours }}"
              startOverrulable: true
              endOverrulable: true
            idMapId: IdImportCanadaWCS
          properties:
            "{{ subset_property_kind }}":
              - key: "{{ subset_property_key }}"
                value: "{{ subset_property_value }}"
          timeSeriesSet:
            - moduleInstanceId: Import{{ nwp_name }}
              valueType: grid
              parameterId: TA.nwp
              locationId: "{{ nwp_name }}"
              timeSeriesType: external forecasting
              timeStep:
                unit: hour
                multiplier: "{{ time_step_hours }}"
              readWriteMode: add originals
          externUnit:
            - parameterId: TA.nwp
              unit: K

  - schema: Workflow
    output: WorkflowFiles/Import/ECCCGrids/Import{{ nwp_name }}Grids.xml
    data:
      version: "1.1"
      properties:
        string:
          - {key: FORECAST, value: "{{ nwp_name }}"}
          - {key: TIMESTEP, value: "{{ time_step_hours }}"}
          - {key: EXPIRYTIME, value: "{{ expiry_time_days }}"}
          - {key: INPUTGRID, value: "{{ nwp_name }}"}
          - {key: OUTPUTGRID, value: $MODELNAME1$Grid}
          - {key: INPUTMODULEINSTANCE, value: "Import{{ nwp_name }}"}
          - {key: ENSEMBLE, value: main}
          - {key: BASINLOCATIONS, value: $MODELNAME1$Basins}
          - {key: STATIONLOCATIONS, value: ECCCStations$REGION$}
          - {key: TIMESERIESTYPE, value: external forecasting}
      activity:
        - runIndependent: true
          moduleInstanceId: "Import{{ nwp_name }}"
{% if workflow_shape == 'inline' %}
        - properties:
            string:
              - {key: PARAMETER, value: PC.nwp}
          runIndependent: true
          moduleInstanceId: "Preprocess{{ nwp_name }}"
          moduleConfigFileName: PreprocessAccumulatedParametersNWPTemplate
        - properties:
            string:
              - {key: LOCATIONSET, value: $MODELNAME1$Basins}
              - {key: INPUTMODULEINSTANCE, value: "Preprocess{{ nwp_name }}"}
          runIndependent: true
          moduleInstanceId: "Preprocess{{ nwp_name }}"
          moduleConfigFileName: AccumulateForecastPrecipTemplate
        - properties:
            string:
              - {key: PARAMETER, value: TA.nwp}
          runIndependent: true
          moduleInstanceId: "Preprocess{{ nwp_name }}"
          moduleConfigFileName: PreprocessInstantaneousParametersNWPTemplate
{% elif workflow_shape == 'delegated' %}
        - workflowId: "Preprocess{{ nwp_name }}$MODELNAME1$"
        - workflowId: "Preprocess{{ nwp_name }}$MODELNAME2$"
{% endif %}

# Cross-spec contributions — entries this pattern adds to project-wide
# singleton files. The expander aggregates these across all instances
# and merges into the singleton's Pydantic instance.
contributions:
  - target: ModuleInstanceDescriptors
    field: moduleInstanceDescriptor
    items:
      - id: Import{{ nwp_name }}
        description: Import {{ nwp_name }} gridded forecast
      - id: Preprocess{{ nwp_name }}
        description: Preprocess {{ nwp_name }} forecast (PC + TA)

  - target: Locations
    field: location
    items:
      - id: "{{ nwp_name }}"
        name: "{{ nwp_name }} source grid"
        x: 0
        y: 0
