{%- set m1 = basin_name if basin_local_ids else '$MODELNAME1' ~ '$' -%}
{%- set m2 = basin_name if basin_local_ids else '$MODELNAME2' ~ '$' -%}
name: raven_basin
description: 'Auto-derived pattern from tutorial instances: Liard.'
variables:
  basin_name:
    type: str
    required: true
  # FEWS-Conform opt-in: when true, contribute ModuleInstanceSets grouping
  # this basin's Raven runs (see contributions block). Default off so the
  # byte-equivalent tutorial oracle (which has no ModuleInstanceSets.xml)
  # is untouched.
  conform_module_instance_sets:
    type: bool
    required: false
    default: false
  # Per-basin identity. The farmed pattern references this ONE model's
  # instances/locationSets via the project-global positional placeholders
  # {{ m1 }}/{{ m2 }} (resolved from sa_global.Properties by basin
  # declaration order). That is wrong for a per-basin pattern: a 1-basin
  # project never defines {{ m2 }} (dead at FEWS startup), and two
  # basins collide on the same slot. When true, the model's ids derive
  # from basin_name instead (concrete, collision-free, resolvable), which
  # also unlocks the Conform wildcard ModuleInstanceSets. Default false so
  # the byte-equivalent tutorial oracle (authored with the placeholders)
  # is untouched.
  basin_local_ids:
    type: bool
    required: false
    default: false
outputs:
- schema: GeneralAdapterRun
  output: ModuleConfigFiles/ModelRun/{{ basin_name }}/{{ basin_name }}ForecastTemplate.xml
  data:
    general:
      description: Raven Model Forecast Template
      piVersion: '1.5'
      rootDir: '%REGION_HOME%/Modules/Raven'
      workDir: '%ROOT_DIR%'
      exportDir: '%ROOT_DIR%/input'
      exportDataSetDir: '%ROOT_DIR%/'
      exportIdMap: IdExportRaven
      exportUnitConversionsId: ExportRaven
      importDir: '%ROOT_DIR%/output'
      importIdMap: IdImportRaven
      dumpFileDir: $GA_DUMPFILEDIR$
      dumpDir: '%ROOT_DIR%'
      diagnosticFile: '%ROOT_DIR%/output/diag.xml'
      missVal: NaN
      timeZone:
        timeZoneName: $TIMEZONE$
      startDateTimeFormat: yyyy-MM-dd hh:mm:ss
      modelTimeStep:
        id: $DAY_TIMESTEP$
    activities:
      startUpActivities:
        purgeActivity:
        - filter: '%ROOT_DIR%/*.*'
        - filter: '%ROOT_DIR%/input/*.*'
        - filter: '%ROOT_DIR%/output/*.*'
        - filter: '%ROOT_DIR%/work/*.rvc'
        - filter: '%ROOT_DIR%/work/*.rvh'
        - filter: '%ROOT_DIR%/work/*.rvi'
        - filter: '%ROOT_DIR%/work/*.rvp'
        - filter: '%ROOT_DIR%/work/*.rvt'
        - filter: '%ROOT_DIR%/work/*.txt'
        - filter: '%ROOT_DIR%/work/*.xml'
      exportActivities:
        exportStateActivity:
        - moduleInstanceId: {{ m2 }}Historic
          stateExportDir: '%ROOT_DIR%/work'
          stateConfigFile: '%ROOT_DIR%/work/stateInfo.xml'
          stateLocations:
            type: file
            stateLocation:
            - readLocation: {{ m2 }}.rvc
              writeLocation: ../output/{{ m2 }}.rvc
          stateSelection:
            coldState:
              startDate:
                unit: day
                multiplier: 0
        exportDataSetActivity:
        - moduleInstanceId: $MODULEDATASET$
        exportParameterActivity:
        - fileName: params_ubc.xml
          templateLocationLooping:
            locationModelLoop:
              locationSetId: {{ m1 }}Basins
              model: {{ m1 }}
          moduleInstanceId: RavenParameters
        exportNetcdfActivity:
        - exportFile: inputs.nc
          timeSeriesSets:
            timeSeriesSet:
            - moduleInstanceId: $INPUTMODULEINSTANCEMETEO$
              valueType: scalar
              parameterId: PC.nwp
              locationSetId: {{ m2 }}SubBasins
              timeSeriesType: external forecasting
              timeStep:
                id: $MODEL2_TIMESTEP$
              readWriteMode: read complete forecast
            - moduleInstanceId: $INPUTMODULEINSTANCEMETEO$
              valueType: scalar
              parameterId: TA.nwp
              qualifierId: min
              locationSetId: {{ m2 }}SubBasins
              timeSeriesType: external forecasting
              timeStep:
                id: $MODEL2_TIMESTEP$
              readWriteMode: read complete forecast
            - moduleInstanceId: $INPUTMODULEINSTANCEMETEO$
              valueType: scalar
              parameterId: TA.nwp
              qualifierId: max
              locationSetId: {{ m2 }}SubBasins
              timeSeriesType: external forecasting
              timeStep:
                id: $MODEL2_TIMESTEP$
              readWriteMode: read complete forecast
          omitMissingValues: true
        exportRunFileActivity:
        - exportFile: '%ROOT_DIR%/run_info.xml'
          properties:
            string:
            - key: ModelLocation
              value: '%ROOT_DIR%/work/Raven.exe'
            - key: RunName
              value: {{ m2 }}
            int:
            - key: DebugMode
              value: 3
      executeActivities:
        executeActivity:
        - command:
            executable: '%ROOT_DIR%/work/bin/Adapter/string_remove.exe'
          arguments:
            argument:
            - '%ROOT_DIR%'
          timeOut: 10000
          ignoreDiagnostics: true
        - command:
            executable: '%ROOT_DIR%\work\bin\Adapter\RavenFEWSAdapter.exe'
          arguments:
            argument:
            - --FEWS_Run_Info_file
            - '%ROOT_DIR%\run_info.xml'
          timeOut: 3000000
      importActivities:
        importNetcdfActivity:
        - importFile: Hydrographs.nc
          timeSeriesSets:
            timeSeriesSet:
            - moduleInstanceId: $MODULE_INSTANCE_ID$
              valueType: scalar
              parameterId: QR.sim
              locationSetId: {{ m2 }}SubBasins
              timeSeriesType: simulated forecasting
              timeStep:
                id: $MODEL2_TIMESTEP$
              readWriteMode: add originals
        - importFile: SNOW_Continuous_Average_BySubbasin.nc
          timeSeriesSets:
            timeSeriesSet:
            - moduleInstanceId: $MODULE_INSTANCE_ID$
              valueType: scalar
              parameterId: SWE.sim
              locationSetId: {{ m2 }}SubBasins
              timeSeriesType: simulated forecasting
              timeStep:
                id: $MODEL2_TIMESTEP$
              readWriteMode: add originals
        - importFile: SNOW_LIQ_Continuous_Average_BySubbasin.nc
          timeSeriesSets:
            timeSeriesSet:
            - moduleInstanceId: $MODULE_INSTANCE_ID$
              valueType: scalar
              parameterId: SWE.mlt
              locationSetId: {{ m2 }}SubBasins
              timeSeriesType: simulated forecasting
              timeStep:
                id: $MODEL2_TIMESTEP$
              readWriteMode: add originals
        - importFile: SOIL[0]_Continuous_Average_BySubbasin.nc
          timeSeriesSets:
            timeSeriesSet:
            - moduleInstanceId: $MODULE_INSTANCE_ID$
              valueType: scalar
              parameterId: SMI.sim
              locationSetId: {{ m2 }}SubBasins
              timeSeriesType: simulated forecasting
              timeStep:
                id: $MODEL2_TIMESTEP$
              readWriteMode: add originals
