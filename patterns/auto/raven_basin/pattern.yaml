          timeOut: 3000000
      importActivities:
        importStateActivity:
        - stateFile:
            importFile: '%REGION_HOME%/Modules/Raven/output/solution.rvc'
            relativeExportFile: Liard.rvc
          synchLevel: 20
        importNetcdfActivity:
        - importFile: Hydrographs.nc
          timeSeriesSets:
            timeSeriesSet:
            - moduleInstanceId: $MODULE_INSTANCE_ID$
              valueType: scalar
              parameterId: QR.sim
              locationSetId: $MODELNAME2$SubBasins
              timeSeriesType: simulated historical
              timeStep:
                id: $MODEL2_TIMESTEP$
              readWriteMode: add originals
        - importFile: SNOW_Continuous_Average_BySubbasin.nc
          timeSeriesSets:
