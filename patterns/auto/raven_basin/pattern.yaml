- schema: Workflow
  output: WorkflowFiles/ModelRun/{{ basin_name }}/Run{{ basin_name }}Historic.xml
  data:
    version: '1.1'
    properties:
      string:
      - key: STARTTIME
        value: '-30'
      - key: ENDTIME
        value: '0'
      - key: INPUTTIMESERIES
        value: ImportE2O
      - key: PARAMETER2
        value: PC.obs
      - key: PARAMETER1
        value: TA.obs
      - key: OUTPUTTIMESERIES
        value: $MODELNAME2$Historic
      - key: INPUTMODULEINSTANCEMETEO
        value: PreprocessE2O
      - key: PARAMETER3
        value: QR.sim
      - key: TYPE1
        value: external historical
      - key: TYPE2
        value: simulated historical
    activity:
    - runIndependent: true
      moduleInstanceId: $MODELNAME2$Historic
      moduleConfigFileName: $MODELNAME2$HistoricTemplate
    - properties:
        string:
        - key: TIMESERIESTYPE
          value: simulated historical
        - key: PARAMETER
          value: QR.sim
        - key: ENSEMBLE
          value: main
        - key: STATIONLOCATIONS
          value: $MODELNAME2$HydroStations
        - key: TIMESTEP
          value: $MODEL2_TIMESTEP$
      runIndependent: true
      moduleInstanceId: $MODELNAME2$Historic
      moduleConfigFileName: PostprocessModelOutputToStationTemplate
