name: nwp_grid_ecmwf_ifs
description: >-
  Import ECMWF IFS open-data forecast grids (2D fixed-parameter type) from the
  ECMWF AWS S3 bucket via the NETCDF-CF_GRID_S3 importType. Farmed from the
  FEWS-Caribbean config (Config/ModuleConfigFiles/Import/ImportEcmwfTemplate.xml
  + IdMapFiles/Import/IdMapFromEcmwf.xml). Emits the timeSeriesImportRun, its
  workflow, and the from-ECMWF idMap. Anonymous S3 credentials; the forecast
  horizon caps the pull via the s3MaxForecastHours property. 3D (height-linked
  wind/temperature) and accumulated (precip/radiation) ECMWF variables are
  separate variants (ImportEcmwf3D / ImportEcmwfAccumulated) to farm later.
variables:
  # Names the module instance (Import<source_name>Meteo), the grid locationId,
  # the output filenames and the idMap.
  source_name:
    type: str
    required: false
    default: Ecmwf
  # Filename discriminator so the 2D / 3D / accumulated variants (which all
  # feed the same Import<source_name>Meteo instance) don't overwrite each
  # other. "" -> ImportEcmwf.xml; "3D" -> ImportEcmwf3D.xml; etc.
  variant:
    type: str
    required: false
    default: ''
  # The variants share one idMap + workflow. The primary (2D) instance
  # emits them; set false on the 3D / accumulated instances so they don't
  # duplicate the singletons.
  emit_idmap:
    type: bool
    required: false
    default: true
  emit_workflow:
    type: bool
    required: false
    default: true
  # Grid time step of the IFS open-data feed (3-hourly out to 144h).
  time_step_hours:
    type: int
    required: false
    default: 3
  # relativeViewPeriod window (hours). start is overrulable so a longer
  # cold run can widen it; end doubles as the s3MaxForecastHours cap.
  view_period_start_hours:
    type: int
    required: false
    default: -6
  view_period_end_hours:
    type: int
    required: false
    default: 144
  expiry_days:
    type: int
    required: false
    default: 5
  # Feed label. Override per variant: "ECMWF - IFS 3D" for the
  # height-linked 3D import, "ECMWF - IFS Accumulated" for accumulated.
  data_feed_id:
    type: str
    required: false
    default: ECMWF - IFS
  # 3D (height-linked) variant: emit the layerIndexAsQualifierId property.
  layer_index_as_qualifier:
    type: bool
    required: false
    default: false
  # Accumulated variant: emit the variable_identification_method property
  # (e.g. grib2_parameter_code) so per-timestep-changing grib names resolve.
  variable_identification_method:
    type: str
    required: false
    default: null
  # Imported parameters. Each entry:
  #   id       FEWS parameterId (internal)
  #   unit     unit FEWS expects on the wire (externUnit)
  #   external the ECMWF grib2 parameter name (idMap external)
  #   interpolate    optional bool -> interpolateSerie (fills the 3h->6h
  #                  gap past 144h). Defaults false.
  #   location       optional locationId override (3D uses Ecmwf2m/Ecmwf10m
  #                  for height-linked temp/wind); defaults to source_name.
  #   cumulativeSum  optional bool -> externUnit cumulativeSum (accumulated
  #                  parameters like precip/radiation). Defaults false.
  # Default reproduces the 2D meteo + wave set the FEWS-Caribbean idMap
  # declares against locationId Ecmwf.
  parameters:
    type: list
    required: false
    default:
      - id: AirPressureMeanSeaLevel
        unit: Pa
        external: Pressure_msl
        interpolate: true
      - id: WaveHeightSignificant
        unit: m
        external: Significant_height_of_combined_wind_waves_and_swell_surface
      - id: WavePeriodPeak
        unit: s
        external: Peak_wave_period_surface
      - id: WaveDirectionMean
        unit: deg
        external: Direction_of_combined_wind_waves_and_swell_surface
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/Import{{ source_name }}{{ variant }}.xml
  data:
    import:
    - general:
        importType: NETCDF-CF_GRID_S3
        serverUrl: https://ecmwf-forecasts.s3.eu-central-1.amazonaws.com/ecmwf-forecasts/%TIME_ZERO(yyyyMMdd)%/%TIME_ZERO(HH)%z/ifs/0p25/oper/
        connectionTimeOutMillis: 1200000
        relativeViewPeriod:
          unit: hour
          start: {{ view_period_start_hours }}
          end: {{ view_period_end_hours }}
          startOverrulable: true
        idMapId: IdMapFrom{{ source_name }}
        unitConversionsId: ImportUnitConversions
        importTimeZone:
          timeZoneName: GMT
        dataFeedId: {{ data_feed_id }}
        expiryTime:
          unit: day
          multiplier: {{ expiry_days }}
      properties:
        bool:
          - key: anonymousS3Credentials
            value: true
{% if layer_index_as_qualifier %}
          - key: layerIndexAsQualifierId
            value: true
{% endif %}
        int:
          - key: s3MaxForecastHours
            value: '{{ view_period_end_hours }}'
{% if variable_identification_method %}
        string:
          - key: variable_identification_method
            value: {{ variable_identification_method }}
{% endif %}
      timeSeriesSet:
{% for p in parameters %}
      - moduleInstanceId: Import{{ source_name }}Meteo
        valueType: grid
        parameterId: {{ p.id }}
        locationId: {{ p.get('location') or source_name }}
        timeSeriesType: temporary external forecasting
        timeStep:
          unit: hour
          multiplier: {{ time_step_hours }}
        readWriteMode: add originals
{% endfor %}
      externUnit:
{% for p in parameters %}
      - parameterId: {{ p.id }}
        unit: {{ p.unit }}
{% if p.get('cumulativeSum') %}
        cumulativeSum: true
{% endif %}
{% endfor %}
      interpolateSerie:
{% for p in parameters if p.get('interpolate') %}
      - parameterId: {{ p.id }}
        interpolate: true
{% endfor %}
{% if emit_workflow %}
- schema: Workflow
  output: WorkflowFiles/Import/Import{{ source_name }}Meteo.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: true
      moduleInstanceId: Import{{ source_name }}Meteo
{% endif %}
{% if emit_idmap %}
- schema: IdMap
  output: IdMapFiles/Import/IdMapFrom{{ source_name }}.xml
  data:
    version: '1.1'
    parameter:
{% for p in parameters %}
    - internal: {{ p.id }}
      external: '{{ p.external }}'
{% endfor %}
    enableOneToOneMapping: true
{% endif %}
contributions: []
