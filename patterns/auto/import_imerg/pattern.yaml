{%- set product_for_url = 'E' if product == 'Early' else ('L' if product == 'Late' else '') -%}
{%- set url_dash = '' if product == 'Final' else '-' -%}
name: import_imerg
description: >-
  Import NASA GPM IMERG satellite precipitation (30-minute rate grids) over
  OPeNDAP, aggregate the rate to hourly accumulation, and interpolate to
  stations + catchments. Farmed from FEWS-Conform (ImportImerg + ProcessImerg
  + ForecastStartImerg + IdMapFromImerg). The IMERG family has three latency
  products selected by the `product` variable — Early (~4h), Late (~12h),
  Final (~3.5 months) — which the FEWS-Conform template drives via
  $ImergPostfix$/$ImergProductForUrl$/$UrlDash$; here each product is a
  concrete instance (ImportImerg<Product> etc.). Distinguishing feature vs a
  generic NWP import: the rate->accumulation aggregation (meanToMean) before
  the grid->scalar closestDistance. Emits the two-block credentialed
  timeSeriesImportRun, the process transform, the forecast-start estimator,
  the shared from-IMERG idMap, and the workflow. Needs a GPM account
  ($GpmUser$/$GpmPassword$ in global.properties).
variables:
  # IMERG latency product: Early | Late | Final. Drives the instance suffix,
  # the OPeNDAP product code, and the filename dash.
  product:
    type: str
    required: false
    default: Early
  source_name:
    type: str
    required: false
    default: Imerg
  gpm_user:
    type: str
    required: false
    default: $GpmUser$
  gpm_password:
    type: str
    required: false
    default: $GpmPassword$
  station_locationset:
    type: str
    required: false
    default: StationsGhcnd
  catchment_locationset:
    type: str
    required: false
    default: CatchmentsWflow
  geo_datum:
    type: str
    required: false
    default: WGS 1984
  grid_expiry:
    type: str
    required: false
    default: $ExpiryTimeGridExternalHistoricalInDays$
  scalar_expiry:
    type: str
    required: false
    default: $ExpiryTimeScalarExternalHistoricalInDays$
  # Emit the shared IdMapFromImerg (product-independent). Set false on
  # secondary product instances so they don't re-emit the singleton.
  emit_idmap:
    type: bool
    required: false
    default: true
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/Import{{ source_name }}{{ product }}.xml
  data:
    import:
{% for offset in ['0', '86400'] %}
    - general:
        importType: NETCDF-CF_GRID
        serverUrl: 'https://gpm1.gesdisc.eosdis.nasa.gov/opendap/hyrax/GPM_L3/GPM_3IMERGHH{{ product_for_url }}.07/%RELATIVE_TIME_IN_SECONDS(yyyy,{{ offset }})%/%RELATIVE_TIME_IN_SECONDS(DDD,{{ offset }})%/catalog.xml'
        fileNameObservationDateTimePattern: "'3B-HHR{{ url_dash }}{{ product_for_url }}.MS.MRG.3IMERG.'yyyyMMdd'-S'HHmmss'-E?'"
        user: {{ gpm_user }}
        password: {{ gpm_password }}
        relativeViewPeriod:
          unit: hour
          start: 0
          end: 24
          startOverrulable: true
          endOverrulable: true
        idMapId: IdMapFrom{{ source_name }}
        unitConversionsId: ImportUnitConversions
        missingValue: '-999'
        importTimeZone:
          timeZoneName: GMT
        dataFeedId: Nasa.{{ source_name }}{{ product }}
        expiryTime:
          unit: day
          multiplier: {{ scalar_expiry }}
      timeSeriesSet:
      - moduleInstanceId: Import{{ source_name }}{{ product }}
        valueType: grid
        parameterId: PrecipitationRateObserved
        locationId: {{ source_name }}
        timeSeriesType: external historical
        timeStep:
          unit: minute
          multiplier: 30
        readWriteMode: add originals
      externUnit:
      - parameterId: PrecipitationRateObserved
        unit: mm/hr
{% endfor %}
- schema: ForecastLengthEstimator
  output: ModuleConfigFiles/Import/ForecastStart{{ source_name }}{{ product }}.xml
  data:
    externalHistoricalTimeSeries:
    - moduleInstanceId: Process{{ source_name }}{{ product }}
      valueType: grid
      parameterId: PrecipitationObserved
      locationId: {{ source_name }}
      timeSeriesType: external historical
      timeStep:
        unit: hour
        multiplier: 1
      relativeViewPeriod:
        unit: hour
        start: $ViewPeriodStartInHours$
        end: '-1'
      readWriteMode: read only
    setTime0ToLatestNonMissing: true
- schema: TransformationModule
  output: ModuleConfigFiles/Import/Process{{ source_name }}{{ product }}.xml
  data:
    version: '1.0'
    variable:
    - variableId: Input
      timeSeriesSet:
        moduleInstanceId: Import{{ source_name }}{{ product }}
        valueType: grid
        parameterId: PrecipitationRateObserved
        locationId: {{ source_name }}
        timeSeriesType: external historical
        timeStep:
          unit: minute
          multiplier: 30
        relativeViewPeriod:
          unit: hour
          start: 0
          end: 24
          startOverrulable: true
          endOverrulable: true
        readWriteMode: read only
    - variableId: Grid
      timeSeriesSet:
        moduleInstanceId: Process{{ source_name }}{{ product }}
        valueType: grid
        parameterId: PrecipitationObserved
        locationId: {{ source_name }}
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: 1
        relativeViewPeriod:
          unit: hour
          start: 0
          end: 24
          startOverrulable: true
          endOverrulable: true
        readWriteMode: add originals
        expiryTime:
          unit: day
          multiplier: {{ grid_expiry }}
    - variableId: Stations
      timeSeriesSet:
        moduleInstanceId: Process{{ source_name }}{{ product }}
        valueType: scalar
        parameterId: PrecipitationObserved
        locationSetId: {{ station_locationset }}
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: 1
        relativeViewPeriod:
          unit: hour
          start: 0
          end: 24
          startOverrulable: true
          endOverrulable: true
        readWriteMode: add originals
        expiryTime:
          unit: day
          multiplier: {{ scalar_expiry }}
    - variableId: Catchments
      timeSeriesSet:
        moduleInstanceId: Process{{ source_name }}{{ product }}
        valueType: scalar
        parameterId: PrecipitationObserved
        locationSetId: {{ catchment_locationset }}
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: 1
        relativeViewPeriod:
          unit: hour
          start: 0
          end: 24
          startOverrulable: true
          endOverrulable: true
        readWriteMode: add originals
        expiryTime:
          unit: day
          multiplier: {{ scalar_expiry }}
    transformation:
    - id: Grid
      body:
        aggregation:
          meanToMean:
            inputVariable:
              variableId: Input
            ignoreMissings: true
            outputVariable:
              variableId: Grid
    - id: Stations
      body:
        interpolationSpatial:
          closestDistance:
            inputVariable:
              variableId: Grid
            distanceGeoDatum: {{ geo_datum }}
            outputVariable:
              variableId: Stations
    - id: Catchments
      body:
        interpolationSpatial:
          closestDistance:
            inputVariable:
              variableId: Grid
            distanceGeoDatum: {{ geo_datum }}
            outputVariable:
              variableId: Catchments
{% if emit_idmap %}
- schema: IdMap
  output: IdMapFiles/Import/IdMapFrom{{ source_name }}.xml
  data:
    version: '1.1'
    map:
    - internalParameter: PrecipitationRateObserved
      internalLocation: {{ source_name }}
      externalParameter: precipitation
      externalLocation: {{ source_name }}
{% endif %}
- schema: Workflow
  output: WorkflowFiles/Import/Import{{ source_name }}{{ product }}.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: true
      moduleInstanceId: ForecastStart{{ source_name }}{{ product }}
    - runIndependent: true
      moduleInstanceId: Import{{ source_name }}{{ product }}
    - runIndependent: true
      moduleInstanceId: Process{{ source_name }}{{ product }}
contributions: []
