name: satellite_precip_GPM
description: 'Auto-derived pattern from tutorial instances: GPM.'
variables:
  source_name:
    type: str
    required: true
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/EarthObservation/Import{{ source_name }}.xml
  data:
    import:
    - general:
        importType: NetcdfGridDataset
        folder: ftp://delftfews.courses%40gmail.com:delftfews.courses%40gmail.com@jsimpson.pps.eosdis.nasa.gov/data/imerg/early/
        fileNameDateTimeFilter:
        - subFolderLevel: 1
          timeStep:
            unit: month
          dateTimePattern: yyyyMM
          preFixLength: 0
          postFixLength: 0
        - subFolderLevel: 2
          timeStep:
            unit: minute
            multiplier: 30
          dateTimePattern: yyyyMMdd'-S'HHmmss
          preFixLength: 23
          postFixLength: 24
        fileNameObservationDateTimePattern: '''3B-HHR-E.MS.MRG.3IMERG.''yyyyMMdd''-S''HHmmss''-E?'''
        failedFolder: $IMPORT_FAILED_FOLDER$/GPM
        backupFolder: $IMPORT_BACKUP_FOLDER$/GPM
        relativeViewPeriod:
          unit: hour
          start: -12
          end: 0
          startOverrulable: true
          endOverrulable: false
        idMapId: IdImportGPM
        unitConversionsId: ImportUnitConversions
        importTimeZone:
          timeZoneOffset: +00:00
        dataFeedId: GPMIMERG.Server.Precipitation
      timeSeriesSet:
      - moduleInstanceId: ImportGPM
        valueType: grid
        parameterId: PC.obs
        locationId: IMERG_world
        timeSeriesType: external historical
        timeStep:
          unit: minute
          multiplier: 30
        readWriteMode: add originals
      externUnit:
      - parameterId: PC.obs
        unit: mm/hr
contributions: []
