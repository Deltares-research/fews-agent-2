name: tpl_aggregate_shift_sealevel
description: >-
  Process observed sea-level series: aggregate the 1-minute observed series to
  a 10-minute mean (instantaneousToMean), then apply a vertical datum shift via
  a coefficient-set expression. Farmed from the FEWS-Caribbean config
  (Config/ModuleConfigFiles/Import/ProcessIoc.xml, a transformationModule).
  Three module-local variables (raw 1-min input, aggregated 10-min, shifted
  10-min) and two transformations (aggregation + user/simple expression).
variables:
  import_instance:
    type: str
    required: false
    default: ImportIoc
  process_instance:
    type: str
    required: false
    default: ProcessIoc
  station_locationset_id:
    type: str
    required: false
    default: StationsIoc
  parameter_id:
    type: str
    required: false
    default: WaterLevelObserved
  # Variable-id stem: <var_prefix>1Min / 10Min / 10MinShifted.
  var_prefix:
    type: str
    required: false
    default: Ioc
  input_timestep_min:
    type: int
    required: false
    default: 1
  output_timestep_min:
    type: int
    required: false
    default: 10
  view_period_start_days:
    type: int
    required: false
    default: -7
  # Coefficient-set id holding the per-location vertical shift (metres);
  # the @<id>@ form resolves it from the coefficientSets config at runtime.
  shift_coefficient:
    type: str
    required: false
    default: VerticalShiftInMeters
outputs:
- schema: TransformationModule
  output: ModuleConfigFiles/Import/Process{{ var_prefix }}.xml
  data:
    version: '1.0'
    variable:
    - variableId: '{{ var_prefix }}1Min'
      timeSeriesSet:
        moduleInstanceId: {{ import_instance }}
        valueType: scalar
        parameterId: {{ parameter_id }}
        locationSetId: {{ station_locationset_id }}
        timeSeriesType: external historical
        timeStep:
          unit: minute
          multiplier: {{ input_timestep_min }}
        relativeViewPeriod:
          unit: day
          start: {{ view_period_start_days }}
          end: 0
          startOverrulable: true
        readWriteMode: read only
    - variableId: '{{ var_prefix }}10Min'
      timeSeriesSet:
        moduleInstanceId: {{ process_instance }}
        valueType: scalar
        parameterId: {{ parameter_id }}
        qualifierId: NotShifted
        locationSetId: {{ station_locationset_id }}
        timeSeriesType: external historical
        timeStep:
          unit: minute
          multiplier: {{ output_timestep_min }}
        relativeViewPeriod:
          unit: day
          start: {{ view_period_start_days }}
          end: 0
          startOverrulable: true
        readWriteMode: add originals
    - variableId: '{{ var_prefix }}10MinShifted'
      timeSeriesSet:
        moduleInstanceId: {{ process_instance }}
        valueType: scalar
        parameterId: {{ parameter_id }}
        locationSetId: {{ station_locationset_id }}
        timeSeriesType: external historical
        timeStep:
          unit: minute
          multiplier: {{ output_timestep_min }}
        relativeViewPeriod:
          unit: day
          start: {{ view_period_start_days }}
          end: 0
          startOverrulable: true
        readWriteMode: add originals
    transformation:
    - id: '{{ var_prefix }}10Min'
      body:
        aggregation:
          instantaneousToMean:
            inputVariable:
              variableId: '{{ var_prefix }}1Min'
            allowMissingValues: 'false'
            includeFirstValueOfAggregationPeriodInCalculation: 'true'
            outputVariable:
              variableId: '{{ var_prefix }}10Min'
    - id: '{{ var_prefix }}10MinShifted'
      body:
        user:
          simple:
            expression: '{{ var_prefix }}10Min + {{ shift_coefficient }}'
            coefficientSetFunctions:
              coefficient:
                '@id': '{{ shift_coefficient }}'
                '@value': '@{{ shift_coefficient }}@'
            outputVariable:
              variableId: '{{ var_prefix }}10MinShifted'
contributions: []
