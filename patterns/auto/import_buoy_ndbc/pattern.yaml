name: import_buoy_ndbc
description: >-
  Import NDBC buoy observations from the 5-day realtime text feed (generalCSV,
  positional parse). Farmed from the FEWS-Caribbean config
  (Config/ModuleConfigFiles/Import/ImportNdbcTemplate.xml). The CSV is
  positional: date/time component columns, then value columns with an
  interleaved skipped column, then trailing skips — so the table uses the
  ordered `columns` escape hatch (document order preserved; the per-type
  grouping would misalign it). Only a subset of the parsed value columns is
  imported as series. Adapted from the source's per-location $LocationId$ loop
  to a locationSetId so it runs as one self-contained import over the buoy set.
variables:
  source_name:
    type: str
    required: false
    default: Ndbc
  station_locationset_id:
    type: str
    required: false
    default: StationsNdbc
  expiry_days:
    type: int
    required: false
    default: 365
  # The full positional CSV layout, in physical column order. Each entry:
  #   kind         the column element (yearColumn, valueColumn, skippedColumn)
  #   unit/parameterId  for valueColumn
  columns:
    type: list
    required: false
    default:
      - {kind: yearColumn}
      - {kind: monthColumn}
      - {kind: dayColumn}
      - {kind: hourColumn}
      - {kind: minuteColumn}
      - {kind: valueColumn, unit: degrees, parameterId: WindDirectionObserved}
      - {kind: valueColumn, unit: m/s, parameterId: WindSpeedObserved}
      - {kind: skippedColumn}
      - {kind: valueColumn, unit: m, parameterId: WaveHeightSignificantObserved}
      - {kind: valueColumn, unit: s, parameterId: WavePeriodPeakObserved}
      - {kind: valueColumn, unit: s, parameterId: WavePeriodMeanObserved}
      - {kind: valueColumn, unit: degrees, parameterId: WaveDirectionPeakObserved}
      - {kind: valueColumn, unit: hPa, parameterId: AirPressureMeanSeaLevelObserved}
      - {kind: valueColumn, unit: '°C', parameterId: AirTemperatureObserved}
      - {kind: skippedColumn}
      - {kind: skippedColumn}
      - {kind: skippedColumn}
      - {kind: skippedColumn}
      - {kind: skippedColumn}
  # Which parsed parameters to actually import (subset of the value columns).
  parameters:
    type: list
    required: false
    default:
      - {id: AirPressureMeanSeaLevelObserved, unit: hPa}
      - {id: AirTemperatureObserved, unit: '°C'}
      - {id: WaveDirectionPeakObserved, unit: degrees}
      - {id: WaveHeightSignificantObserved, unit: m}
      - {id: WavePeriodMeanObserved, unit: s}
      - {id: WavePeriodPeakObserved, unit: s}
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/Import{{ source_name }}.xml
  data:
    import:
    - general:
        importType: generalCSV
        serverUrl: https://www.ndbc.noaa.gov/data/5day2/$NdbcId$_5day.txt
        table:
          columns:
{% for c in columns %}
          - {{ c | tojson }}
{% endfor %}
        idMapId: IdMapFrom{{ source_name }}
        unitConversionsId: ImportUnitConversions
        importTimeZone:
          timeZoneName: GMT
        dataFeedId: NOAA - NDBC
        expiryTime:
          unit: day
          multiplier: {{ expiry_days }}
        skipFirstLinesCount: 2
        columnSeparator: ' '
        decimalSeparator: .
      timeSeriesSet:
{% for p in parameters %}
      - moduleInstanceId: Import{{ source_name }}
        valueType: scalar
        parameterId: {{ p.id }}
        locationSetId: {{ station_locationset_id }}
        timeSeriesType: external historical
        timeStep:
          unit: nonequidistant
        readWriteMode: add originals
{% endfor %}
      externUnit:
{% for p in parameters %}
      - parameterId: {{ p.id }}
        unit: {{ p.unit }}
{% endfor %}
- schema: Workflow
  output: WorkflowFiles/Import/Import{{ source_name }}.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: true
      moduleInstanceId: Import{{ source_name }}
- schema: IdMap
  output: IdMapFiles/Import/IdMapFrom{{ source_name }}.xml
  data:
    version: '1.1'
    locationIdFunction:
    - internalLocationSet: {{ station_locationset_id }}
      externalLocationFunction: '@{{ source_name }}Id@'
    enableOneToOneMapping: true
contributions: []
