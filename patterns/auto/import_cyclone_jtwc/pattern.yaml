name: import_cyclone_jtwc
description: >-
  Import Joint Typhoon Warning Center (JTWC) cyclone forecast tracks via the
  bundled FEWS JTWC parser (parserClassName, not a CSV table). Farmed from the
  FEWS-Caribbean config (Config/ModuleConfigFiles/Import/ImportJtwc.xml +
  IdMapFiles/Import/IdMapFromJtwc.xml). Reads downloaded track files from the
  DownloadProcessCycloneTracks module's _downloads folder and lands
  lat/lon/max-wind as nonequidistant scalar series on the track location.
  Pairs with the DownloadProcessCycloneTracks generalAdapterRun (a model-phase
  pattern still to farm).
variables:
  source_name:
    type: str
    required: false
    default: Jtwc
  # FEWS parser class that reads the JTWC track format.
  parser_class:
    type: str
    required: false
    default: nl.wldelft.timeseriesparsers.JTWCTimeSeriesParser
  # Folder the upstream download module drops raw track files into.
  # $ModulesFolder$ is a FEWS runtime property (kept literal).
  download_folder:
    type: str
    required: false
    default: $ModulesFolder$/DownloadProcessCycloneTracks/_downloads
  # Location the track series are written to.
  track_location_id:
    type: str
    required: false
    default: TrackFews
  expiry_days:
    type: int
    required: false
    default: 5
  # Track quantities. Each entry: id (internal FEWS parameterId),
  # external (JTWC field name), unit.
  parameters:
    type: list
    required: false
    default:
      - id: Latitude
        external: lat
        unit: degrees
      - id: Longitude
        external: lon
        unit: degrees
      - id: WindSpeedMaximum
        external: maxWind
        unit: knots
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/Import{{ source_name }}.xml
  data:
    import:
    - general:
        parserClassName: {{ parser_class }}
        folder: {{ download_folder }}
        deleteImportedFiles: false
        idMapId: IdMapFrom{{ source_name }}
        unitConversionsId: ImportUnitConversions
        dataFeedId: JTWC (FEWS parser)
        expiryTime:
          unit: day
          multiplier: {{ expiry_days }}
        relativeForecastTime:
          unit: hour
          value: 0
      timeSeriesSet:
{% for p in parameters %}
      - moduleInstanceId: Import{{ source_name }}
        valueType: scalar
        parameterId: {{ p.id }}
        locationId: {{ track_location_id }}
        timeSeriesType: external forecasting
        timeStep:
          unit: nonequidistant
        readWriteMode: add originals
{% endfor %}
      externUnit:
{% for p in parameters %}
      - parameterId: {{ p.id }}
        unit: {{ p.unit }}
{% endfor %}
- schema: Workflow
  output: WorkflowFiles/Import/Import{{ source_name }}.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: true
      moduleInstanceId: Import{{ source_name }}
- schema: IdMap
  output: IdMapFiles/Import/IdMapFrom{{ source_name }}.xml
  data:
    version: '1.1'
    parameter:
{% for p in parameters %}
    - internal: {{ p.id }}
      external: '{{ p.external }}'
{% endfor %}
    enableOneToOneMapping: true
contributions: []
