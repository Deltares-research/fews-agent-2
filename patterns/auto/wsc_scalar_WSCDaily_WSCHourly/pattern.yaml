name: wsc_scalar_WSCDaily_WSCHourly
description: 'Auto-derived pattern from tutorial instances: WSCDaily, WSCHourly.'
variables:
  wsc_variant:
    type: str
    required: true
  import_general_serverUrl:
    type: str
    default: https://dd.weather.gc.ca/hydrometric/csv/$REGION$/daily/$REGION$_$LOOP_LOCATION_ID$_daily_hydrometric.csv
  activity_moduleInstanceId:
    type: str
    default: ImportWSCDaily
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/ECCCScalar/Import{{ wsc_variant }}.xml
  data:
    import:
    - general:
        importType: generalCSV
        serverUrl: '{{ import_general_serverUrl }}'
        table:
          locationColumn:
            name: ID
          dateTimeColumn:
            name: Date
            pattern: yyyy-MM-dd'T'HH:mm:ssXXX
          valueColumn:
          - name: Water Level / Niveau d'eau (m)
            unit: m
            parameterId: HG.obs
          - name: "Discharge / D\xE9bit (cms)"
            unit: m3/s
            parameterId: QR.obs
        idMapId: IdImportWSC
        unitConversionsId: ImportUnitConversions
        importTimeZone:
          timeZoneOffset: +00:00
        dataFeedId: WSC_daily_server
        expiryTime:
          unit: day
          multiplier: 365
        skipFirstLinesCount: 0
      tolerance:
      - timeUnit: minute
        unitCount: 1
        parameterId: HG.obs
      - timeUnit: minute
        unitCount: 1
        parameterId: QR.obs
      timeSeriesSet:
      - moduleInstanceId: ImportWSC
        valueType: scalar
        parameterId: HG.obs
        locationSetId: WSCStations$REGION$
        timeSeriesType: external historical
        timeStep:
          unit: minute
          multiplier: 5
        readWriteMode: add originals
      - moduleInstanceId: ImportWSC
        valueType: scalar
        parameterId: QR.obs
        locationSetId: WSCStations$REGION$
        timeSeriesType: external historical
        timeStep:
          unit: minute
          multiplier: 5
        readWriteMode: add originals
- schema: Workflow
  output: WorkflowFiles/Import/ECCCScalar/Import{{ wsc_variant }}.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: true
      moduleInstanceId: '{{ activity_moduleInstanceId }}'
      loopLocationSetId: WSCStations$REGION$
contributions: []
