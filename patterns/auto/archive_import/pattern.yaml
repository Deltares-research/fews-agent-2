name: archive_import
description: >-
  Import data back from the Delft-FEWS Open Archive (importArchiveModule).
  Farmed from FEWS-Conform (ModuleConfigFiles/Archive/FromArchiveData.xml +
  FromArchiveHistoricalEvents.xml). The inbound half of the archive round-trip
  (pairs with archive_export_netcdf). Driven by a `categories` list: the
  time-series categories (simulated / externalForecast / observed) read from
  `<archive_root>/<subfolder>` via a shared timeSeriesSetIdMap; messages and
  ratingCurves are folder-only; historicalEvents reads `<archive_root>`
  directly via idMapId. Emits the ImportArchiveModule config + the
  From_Archive_<Name> workflow that runs it.
keywords: [archive import, open archive import, from the archive, read the archive]
variables:
  # Archive import name → filenames + moduleInstanceId (FromArchive<Name>).
  name:
    type: str
    required: true
  # Base archive folder token (e.g. $ArchiveDownloadFolder$ or
  # $ToFewsFolder$/HistoricEvents). Time-series categories append a subfolder;
  # historicalEvents uses it directly.
  archive_root:
    type: str
    required: true
  # Which import kinds to include. Subset of: simulated, externalForecast,
  # observed, messages, ratingCurves, historicalEvents.
  categories:
    type: list
    required: true
  # timeSeriesSetIdMap for the simulated/externalForecast/observed categories.
  id_map:
    type: str
    required: false
    default: ''
  # idMapId for the historicalEvents category.
  historical_events_id_map:
    type: str
    required: false
    default: ''
outputs:
- schema: ImportArchiveModule
  output: ModuleConfigFiles/Archive/FromArchive{{ name }}.xml
  data:
{% if categories and 'simulated' in categories %}
    importSimulated:
    - importFolder: {{ archive_root }}/simulated
{% if id_map %}
      timeSeriesSetIdMap: {{ id_map }}
{% endif %}
{% endif %}
{% if categories and 'externalForecast' in categories %}
    importExternalForecast:
    - importFolder: {{ archive_root }}/externalforecasts
{% if id_map %}
      timeSeriesSetIdMap: {{ id_map }}
{% endif %}
{% endif %}
{% if categories and 'observed' in categories %}
    importObserved:
    - importFolder: {{ archive_root }}/observed
{% if id_map %}
      timeSeriesSetIdMap: {{ id_map }}
{% endif %}
{% endif %}
{% if categories and 'messages' in categories %}
    importMessages:
    - importFolder: {{ archive_root }}/messages
{% endif %}
{% if categories and 'ratingCurves' in categories %}
    importRatingCurves:
    - importFolder: {{ archive_root }}/ratingcurves
{% endif %}
{% if categories and 'historicalEvents' in categories %}
    importHistoricalEvents:
    - importFolder: {{ archive_root }}
      idMapId: {{ historical_events_id_map }}
{% endif %}
- schema: Workflow
  output: WorkflowFiles/Archive/From_Archive_{{ name }}.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: true
      moduleInstanceId: FromArchive{{ name }}
contributions: []
