name: amalgamate
description: >-
  Amalgamate short-span import runs into compact per-parameter time series to
  keep the datastore lean (importAmalgamate, a Maintenance module). Farmed from
  the FEWS-Caribbean config (Config/ModuleConfigFiles/Maintenance/Amalgamate*.xml).
  One pattern covers the whole cadence family (Day/Week/Month/Orphans) as
  instances: name the module, list the workflows to amalgamate, set the minimal
  age, and whether to sweep orphaned (expired, detached) series.
variables:
  name:
    type: str
    required: false
    default: AmalgamateDay
  # Workflows whose import runs get amalgamated.
  workflow_ids:
    type: list
    required: false
    default:
      - Import_Ghcnd
      - Import_Ioc
  # Only amalgamate runs older than this (days).
  minimal_age_days:
    type: int
    required: false
    default: 7
  # Sweep timeseries no longer attached to any task run / session.
  amalgamate_orphans:
    type: bool
    required: false
    default: false
outputs:
- schema: ImportAmalgamate
  output: ModuleConfigFiles/Maintenance/{{ name }}.xml
  data:
{% if workflow_ids %}
    workflowId:
{% for w in workflow_ids %}
    - {{ w }}
{% endfor %}
    importRunMinimalAge:
      unit: day
      multiplier: {{ minimal_age_days }}
{% endif %}
    amalgamateOrphans: {{ 'true' if amalgamate_orphans else 'false' }}
- schema: Workflow
  output: WorkflowFiles/Maintenance/{{ name }}.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: true
      moduleInstanceId: {{ name }}
contributions: []
