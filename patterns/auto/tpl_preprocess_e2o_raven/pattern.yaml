name: tpl_preprocess_e2o_raven
description: 'Auto-derived pattern from tutorial instances: PreprocessE2ORavenTemplate.'
variables:
  template_name:
    type: str
    required: true
outputs:
- schema: TransformationModule
  output: ModuleConfigFiles/Preprocess/RavenModelData/{{ template_name }}.xml
  data:
    version: '1.0'
    variable:
    - variableId: gridded_precip
      timeSeriesSet:
        moduleInstanceId: $INPUTMODULEINSTANCE$
        valueType: grid
        parameterId: PC.obs
        locationId: $INPUTGRID$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          id: $DAY_TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: gridded_temperature
      timeSeriesSet:
        moduleInstanceId: $INPUTMODULEINSTANCE$
        valueType: grid
        parameterId: TA.obs
        locationId: $INPUTGRID$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: basin_precip
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: PC.obs
        locationSetId: $BASINLOCATIONS$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: station_precip
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: PC.obs
        locationSetId: $STATIONLOCATIONS$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: basin_temperature
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: TA.obs
        locationSetId: $BASINLOCATIONS$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: station_temperature
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: TA.obs
        locationSetId: $STATIONLOCATIONS$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    transformation:
    - id: basin_precip
      body:
        interpolationSpatial:
          average:
            inputVariable:
              variableId: gridded_precip
            outputVariable:
              variableId: basin_precip
    - id: station_precip
      body:
        interpolationSpatial:
          closestDistance:
            inputVariable:
              variableId: gridded_precip
            distanceGeoDatum: $DISTANCEGEODATUM$
            outputVariable:
              variableId: station_precip
    - id: basin_temperature
      body:
        interpolationSpatial:
          average:
            inputVariable:
              variableId: gridded_temperature
            outputVariable:
              variableId: basin_temperature
    - id: station_temperature
      body:
        interpolationSpatial:
          closestDistance:
            inputVariable:
              variableId: gridded_temperature
            distanceGeoDatum: $DISTANCEGEODATUM$
            outputVariable:
              variableId: station_temperature
contributions: []
