name: import_era5
description: >-
  Import ERA5 (Copernicus reanalysis) NetCDF grids that a companion download
  module has dropped into a folder, then forecast-start off the latest grid
  and interpolate to stations + catchments. Farmed from FEWS-Conform
  (ImportEra5.xml + ForecastStartEra5.xml + ProcessEra5.xml + IdMapFromEra5.xml).
  Pairs with download_via_python_venv (which fetches the .nc files via a CDS
  API venv). Emits: the folder-based timeSeriesImportRun (external historical,
  hourly, per-parameter tolerance), a forecastLengthEstimator (T0 = latest
  non-missing grid), a grid->scalar closestDistance transformationModule onto
  a station + a catchment locationSet, the from-ERA5 idMap, and the workflow.
variables:
  source_name:
    type: str
    required: false
    default: Era5
  # Where the download module leaves the .nc files (download_via_python_venv
  # writes to $ModulesFolder$/Download<Source>/ToFews).
  download_folder:
    type: str
    required: false
    default: $ModulesFolder$/DownloadEra5/ToFews
  failed_folder:
    type: str
    required: false
    default: $ToFewsFailedFolder$/Copernicus/Era5
  backup_folder:
    type: str
    required: false
    default: $ToFewsBackupFolder$/Copernicus/Era5
  data_feed_id:
    type: str
    required: false
    default: Copernicus.Era5
  import_expiry:
    type: str
    required: false
    default: $ExpiryTimeGridExternalHistoricalInDays$
  scalar_expiry:
    type: str
    required: false
    default: $ExpiryTimeScalarExternalHistoricalInDays$
  tolerance_hours:
    type: int
    required: false
    default: 2
  geo_datum:
    type: str
    required: false
    default: WGS 1984
  # Interpolation output sets.
  station_locationset:
    type: str
    required: false
    default: StationsGhcnd
  catchment_locationset:
    type: str
    required: false
    default: CatchmentsWflow
  # Parameter that forecast-start + the grid->scalar transform operate on.
  process_parameter:
    type: str
    required: false
    default: Precipitation
  # Imported grid parameters. Each: id (FEWS parameterId), unit (externUnit
  # wire unit), external (idMap externalParameter grib/netcdf name).
  parameters:
    type: list
    required: false
    default:
      - id: AirTemperature
        unit: K
        external: 2_metre_temperature_surface
      - id: Precipitation
        unit: m
        external: Total_precipitation_surface_1_Hour_Accumulation
      - id: RadiationSolar
        unit: Jm-2
        external: Surface_short-wave_solar_radiation_downwards_surface_1_Hour_Accumulation
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/Import{{ source_name }}.xml
  data:
    import:
    - general:
        importType: NETCDF-CF_GRID
        folder: {{ download_folder }}
        fileNamePatternFilter: '*.nc'
        failedFolder: {{ failed_folder }}
        backupFolder: {{ backup_folder }}
        deleteImportedFiles: false
        idMapId: IdMapFrom{{ source_name }}
        unitConversionsId: ImportUnitConversions
        importTimeZone:
          timeZoneOffset: '+00:00'
        dataFeedId: {{ data_feed_id }}
        expiryTime:
          unit: day
          multiplier: {{ import_expiry }}
      tolerance:
{% for p in parameters %}
      - parameterId: {{ p.id }}
        timeUnit: hour
        unitCount: {{ tolerance_hours }}
{% endfor %}
      timeSeriesSet:
{% for p in parameters %}
      - moduleInstanceId: Import{{ source_name }}
        valueType: grid
        parameterId: {{ p.id }}
        locationId: {{ source_name }}
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: 1
        readWriteMode: add originals
{% endfor %}
      externUnit:
{% for p in parameters %}
      - parameterId: {{ p.id }}
        unit: {{ p.unit }}
{% endfor %}
- schema: ForecastLengthEstimator
  output: ModuleConfigFiles/Import/ForecastStart{{ source_name }}.xml
  data:
    externalHistoricalTimeSeries:
    - moduleInstanceId: Import{{ source_name }}
      valueType: grid
      parameterId: {{ process_parameter }}
      locationId: {{ source_name }}
      timeSeriesType: external historical
      timeStep:
        unit: hour
        multiplier: 1
      relativeViewPeriod:
        unit: hour
        start: $ViewPeriodStartInHours$
        end: $ViewPeriodEndInHours$
        startOverrulable: true
        endOverrulable: false
      readWriteMode: read only
    setTime0ToLatestNonMissing: true
    skipRunWhenTime0EqualToLastRun: true
- schema: TransformationModule
  output: ModuleConfigFiles/Import/Process{{ source_name }}.xml
  data:
    version: '1.0'
    variable:
    - variableId: Input
      timeSeriesSet:
        moduleInstanceId: Import{{ source_name }}
        valueType: grid
        parameterId: {{ process_parameter }}
        locationId: {{ source_name }}
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: 1
        relativeViewPeriod:
          unit: hour
          start: $ViewPeriodStartInHours$
          end: $ViewPeriodEndInHours$
          startOverrulable: true
          endOverrulable: true
        readWriteMode: read only
    - variableId: Stations
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: {{ process_parameter }}
        locationSetId: {{ station_locationset }}
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: 1
        relativeViewPeriod:
          unit: hour
          start: $ViewPeriodStartInHours$
          end: $ViewPeriodEndInHours$
          startOverrulable: true
          endOverrulable: true
        readWriteMode: add originals
        expiryTime:
          unit: day
          multiplier: {{ scalar_expiry }}
    - variableId: Catchments
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: {{ process_parameter }}
        locationSetId: {{ catchment_locationset }}
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: 1
        relativeViewPeriod:
          unit: hour
          start: $ViewPeriodStartInHours$
          end: $ViewPeriodEndInHours$
          startOverrulable: true
          endOverrulable: true
        readWriteMode: add originals
        expiryTime:
          unit: day
          multiplier: {{ scalar_expiry }}
    transformation:
    - id: Stations
      body:
        interpolationSpatial:
          closestDistance:
            inputVariable:
              variableId: Input
            distanceGeoDatum: {{ geo_datum }}
            outputVariable:
              variableId: Stations
    - id: Catchments
      body:
        interpolationSpatial:
          closestDistance:
            inputVariable:
              variableId: Input
            distanceGeoDatum: {{ geo_datum }}
            outputVariable:
              variableId: Catchments
- schema: IdMap
  output: IdMapFiles/Import/IdMapFrom{{ source_name }}.xml
  data:
    version: '1.1'
    map:
{% for p in parameters %}
    - internalParameter: {{ p.id }}
      internalLocation: {{ source_name }}
      externalParameter: '{{ p.external }}'
      externalLocation: {{ source_name }}
{% endfor %}
- schema: Workflow
  output: WorkflowFiles/Import/Import{{ source_name }}.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: true
      moduleInstanceId: ForecastStart{{ source_name }}
    - runIndependent: true
      moduleInstanceId: Import{{ source_name }}
    - runIndependent: true
      moduleInstanceId: Process{{ source_name }}
contributions: []
