{%- set venv = venv_name or ('EnvDownload' ~ source_name) -%}
{%- set bat = bat_script or ('Download' ~ source_name ~ '.bat') -%}
{%- set idmap = import_id_map or ('IdMapFrom' ~ source_name) -%}
{%- set iloc = import_location or source_name -%}
name: download_via_python_venv
description: >-
  Fetch external data by shelling out to a Python virtual environment (e.g. a
  Copernicus CDS API request). Farmed from FEWS-Conform
  ModuleConfigFiles/Import/DownloadEra5.xml — the one generalAdapterRun in the
  config that calls external code. Emits a Download<Source> general adapter:
  a credential-preserving startup purge (keeps .cdsapirc while clearing
  transient .bat/.py/.xml/ToFews/dev files), an exportRunFileActivity writing
  runinfo.xml with the download Area + Parameter spec, an executeActivity that
  runs Download<Source>.bat against a named venv, and a dummy netCDF import.
  The configurator supplies the venv + scripts as a ModuleDataSet
  (ModuleDataSetFiles/<...>) and the .cdsapirc credential (see
  howto_install_python.md). Note: the source's <importUnitConversionsId> and
  the purge <description>s are omitted (not modelled by the schema).
variables:
  # Data source name → module id Download<Source>, rootDir, default venv/idMap.
  source_name:
    type: str
    required: true
  # moduleInstanceId the (dummy) netCDF import writes to (e.g. ImportEra5).
  import_module_instance:
    type: str
    required: true
  # The runinfo.xml download spec (passed to the python script as run props).
  download_area:
    type: str
    required: true
  download_parameters:
    type: str
    required: true
  # Overrides (default off source_name).
  venv_name:
    type: str
    required: false
    default: ''
  bat_script:
    type: str
    required: false
    default: ''
  py_script:
    type: str
    required: false
    default: CdsApiRequest.py
  import_id_map:
    type: str
    required: false
    default: ''
  import_location:
    type: str
    required: false
    default: ''
  import_parameter:
    type: str
    required: false
    default: Precipitation
  import_file:
    type: str
    required: false
    default: download_%TIME0%.nc
  import_time_step_hours:
    type: str
    required: false
    default: '1'
  time0_format:
    type: str
    required: false
    default: yyyyMM
  timeout:
    type: int
    required: false
    default: 14400000
outputs:
- schema: GeneralAdapterRun
  output: ModuleConfigFiles/Import/Download{{ source_name }}.xml
  data:
    general:
      rootDir: $ModulesFolder$/Download{{ source_name }}
      workDir: '%ROOT_DIR%'
      exportDir: '%ROOT_DIR%'
      exportDataSetDir: '%ROOT_DIR%'
      importDir: '%ROOT_DIR%/ToFews'
      importIdMap: {{ idmap }}
      dumpFileDir: $DumpFilesFolder$
      dumpDir: '%ROOT_DIR%'
      diagnosticFile: '%ROOT_DIR%/ToFews/Log.txt'
      time0Format: {{ time0_format }}
    activities:
      startUpActivities:
        purgeActivity:
        - filter: '%ROOT_DIR%/*.bat'
        - filter: '%ROOT_DIR%/*.py'
        - filter: '%ROOT_DIR%/*.xml'
        - filter: '%ROOT_DIR%/ToFews/*'
        - includeSubdirectories: true
          filter: '%ROOT_DIR%/dev/*'
      exportActivities:
        exportDataSetActivity:
        - moduleInstanceId: Download{{ source_name }}
        exportRunFileActivity:
        - exportFile: '%ROOT_DIR%/runinfo.xml'
          properties:
            string:
            - key: Area
              value: '{{ download_area }}'
            - key: Parameter
              value: "{{ download_parameters }}"
      executeActivities:
        executeActivity:
        - command:
            executable: '%ROOT_DIR%/{{ bat }}'
          arguments:
            argument:
            - {{ py_script }}
            - $PythonEnvironmentFolder$/{{ venv }}
            - '%ROOT_DIR%/ToFews/Log.txt'
          timeOut: {{ timeout }}
          ignoreDiagnostics: true
      importActivities:
        importNetcdfActivity:
        - importFile: {{ import_file }}
          timeSeriesSets:
            timeSeriesSet:
            - moduleInstanceId: {{ import_module_instance }}
              valueType: grid
              parameterId: {{ import_parameter }}
              locationId: {{ iloc }}
              timeSeriesType: temporary
              timeStep:
                unit: hour
                multiplier: '{{ import_time_step_hours }}'
              readWriteMode: add originals
contributions: []
