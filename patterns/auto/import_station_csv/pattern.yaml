name: import_station_csv
description: >-
  Import station observations from CSV files dropped in the import folder
  (FEWS generalCSV import). Farmed from the Config_Basic course family
  (Import_Station, 2017-2019 vintages): one <import> block per feed
  (e.g. water level, flow), each reading a per-feed subfolder with a
  location/date/time/value table. The value column's name is the external
  parameter; the emitted IdMap maps it onto the internal parameterId.
  Location id mappings are project data - add them to the IdMap via
  inputs/ when the CSV station labels differ from FEWS locationIds.
variables:
  # Names the module instance (Import<source_name>), the workflow and the
  # idMap (IdImport<source_name>CSV). Keep the default unless the project
  # has several distinct CSV station feeds.
  source_name:
    type: str
    required: false
    default: Station
  # One entry per CSV feed. Each feed becomes one <import> block reading
  # $IMPORT_FOLDER$/CSV/<kind> plus one timeSeriesSet:
  #   kind             subfolder + feed label (Level, Flow, ...)
  #   column           CSV value-column header (external parameter name)
  #   unit             unit of the value column
  #   parameter_id     internal FEWS parameterId the column maps to
  #   location_set_id  locationSet receiving the scalars
  feeds:
    type: list
    required: false
    default:
      - kind: Level
        column: Level
        unit: cm
        parameter_id: H.obs
        location_set_id: hydro_stations_Level
      - kind: Flow
        column: Flow
        unit: m3/s
        parameter_id: Q.obs
        location_set_id: hydro_stations_Flow
  # CSV table layout, shared by all feeds.
  location_column:
    type: str
    required: false
    default: Location
  date_column:
    type: str
    required: false
    default: Date
  date_pattern:
    type: str
    required: false
    default: dd-MM-yyyy
  time_column:
    type: str
    required: false
    default: Time
  time_pattern:
    type: str
    required: false
    default: HH:mm:ss
  timezone_offset:
    type: str
    required: false
    default: '+00:00'
  timestep_minutes:
    type: int
    required: false
    default: 10
  expiry_days:
    type: int
    required: false
    default: 365
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/Station/Import{{ source_name }}.xml
  data:
    import:
{% for f in feeds %}
    - general:
        importType: generalCSV
        folder: $IMPORT_FOLDER$/CSV/{{ f.kind }}
        fileNamePatternFilter: '*.csv'
        failedFolder: $IMPORT_FAILED_FOLDER$
        backupFolder: $IMPORT_BACKUP_FOLDER$
        table:
          locationColumn:
            name: '{{ location_column }}'
          valueColumn:
          - name: '{{ f.column }}'
            unit: '{{ f.unit }}'
          dateColumn:
          - name: '{{ date_column }}'
            pattern: '{{ date_pattern }}'
          timeColumn:
          - name: '{{ time_column }}'
            pattern: '{{ time_pattern }}'
        idMapId: IdImport{{ source_name }}CSV
        unitConversionsId: ImportUnitConversions
        importTimeZone:
          timeZoneOffset: '{{ timezone_offset }}'
        dataFeedId: Import.CSV.{{ f.kind }}
        expiryTime:
          unit: day
          multiplier: {{ expiry_days }}
        skipFirstLinesCount: 0
      timeSeriesSet:
      - moduleInstanceId: Import{{ source_name }}
        valueType: scalar
        parameterId: {{ f.parameter_id }}
        locationSetId: {{ f.location_set_id }}
        timeSeriesType: external historical
        timeStep:
          unit: minute
          multiplier: {{ timestep_minutes }}
        readWriteMode: add originals
{% endfor %}
- schema: Workflow
  output: WorkflowFiles/Import/Import{{ source_name }}Observations.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: true
      moduleInstanceId: Import{{ source_name }}
- schema: IdMap
  output: IdMapFiles/Import/IdImport{{ source_name }}CSV.xml
  data:
    version: '1.1'
    parameter:
{% for f in feeds %}
    - internal: {{ f.parameter_id }}
      external: '{{ f.column }}'
{% endfor %}
contributions: []
