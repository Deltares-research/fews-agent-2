name: tpl_merge_forecast_grids_ens
description: 'Auto-derived pattern from tutorial instances: MergeForecastGridsEnsTemplate.'
variables:
  template_name:
    type: str
    required: true
outputs:
- schema: TransformationModule
  output: ModuleConfigFiles/Preprocess/MergeData/{{ template_name }}.xml
  data:
    version: '1.0'
    variable:
    - variableId: Historic_PC
      timeSeriesSet:
        moduleInstanceId: $HISTORICMODULEINSTANCE$
        valueType: grid
        parameterId: PC.nwp
        locationId: $OUTPUTGRID$
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: 1
        relativeViewPeriod:
          unit: day
          start: $STARTTIME$
          end: 0
          startOverrulable: true
        readWriteMode: add originals
        ensembleId: main
    - variableId: Historic_TA
      timeSeriesSet:
        moduleInstanceId: $HISTORICMODULEINSTANCE$
        valueType: grid
        parameterId: TA.nwp
        locationId: $OUTPUTGRID$
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: 1
        relativeViewPeriod:
          unit: day
          start: $STARTTIME$
          end: 0
          startOverrulable: true
        readWriteMode: add originals
        ensembleId: main
    - variableId: Forecast_PC
      timeSeriesSet:
        moduleInstanceId: $FORECASTMODULEINSTANCE$
        valueType: grid
        parameterId: PC.nwp
        locationId: $OUTPUTGRID$
        timeSeriesType: external forecasting
        timeStep:
          unit: hour
          multiplier: 1
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: Forecast_TA
      timeSeriesSet:
        moduleInstanceId: $FORECASTMODULEINSTANCE$
        valueType: grid
        parameterId: TA.nwp
        locationId: $OUTPUTGRID$
        timeSeriesType: external forecasting
        timeStep:
          unit: hour
          multiplier: 1
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: Model_PC
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: grid
        parameterId: PC.nwp
        locationId: $OUTPUTGRID$
        timeSeriesType: simulated forecasting
        timeStep:
          unit: hour
          multiplier: 1
        relativeViewPeriod:
          unit: day
          start: $STARTTIME$
          end: $ENDTIME$
          startOverrulable: true
          endOverrulable: true
        readWriteMode: read only
        ensembleId: $ENSEMBLE$
    - variableId: Model_TA
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: grid
        parameterId: TA.nwp
        locationId: $OUTPUTGRID$
        timeSeriesType: simulated forecasting
        timeStep:
          unit: hour
          multiplier: 1
        relativeViewPeriod:
          unit: day
          start: $STARTTIME$
          end: $ENDTIME$
          startOverrulable: true
          endOverrulable: true
        readWriteMode: read only
        ensembleId: $ENSEMBLE$
    transformation:
    - id: merge_PC
      body:
        merge:
          simple:
            inputVariable:
            - variableId: Forecast_PC
            - variableId: Historic_PC
            outputVariable:
              variableId: Model_PC
    - id: merge_TA
      body:
        merge:
          simple:
            inputVariable:
            - variableId: Forecast_TA
            - variableId: Historic_TA
            outputVariable:
              variableId: Model_TA
contributions: []
