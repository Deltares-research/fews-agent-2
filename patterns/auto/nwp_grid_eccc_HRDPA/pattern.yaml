name: nwp_grid_eccc_HRDPA
description: 'Auto-derived pattern from tutorial instances: HRDPA.'
variables:
  nwp_name:
    type: str
    required: true
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/ECCCGrids/Import{{ nwp_name }}.xml
  data:
    import:
    - general:
        importType: CanadaMeteoWCS
        serverUrl: https://geo.weather.gc.ca/geomet?SERVICE=WCS&VERSION=2.0.1&REQUEST=GetCoverage
        relativeViewPeriod:
          unit: day
          start: -7
          end: 0
          startOverrulable: true
          endOverrulable: true
        idMapId: IdImportCanadaWCS
      properties:
        bool:
        - key: useSubset
          value: false
      timeSeriesSet:
      - moduleInstanceId: ImportHRDPA
        valueType: grid
        parameterId: PC.sim
        locationId: HRDPA
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: 6
        readWriteMode: add originals
      externUnit:
      - parameterId: PC.sim
        unit: kg m-2
- schema: Workflow
  output: WorkflowFiles/Import/ECCCGrids/Import{{ nwp_name }}Grids.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: true
      moduleInstanceId: ImportHRDPA
contributions: []
