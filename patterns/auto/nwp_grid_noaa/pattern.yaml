name: nwp_grid_noaa
description: 'Auto-derived pattern from tutorial instances: GFS.'
variables:
  nwp_name:
    type: str
    required: true
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/NOAA/Import{{ nwp_name }}.xml
  data:
    import:
    - general:
        importType: NETCDF-CF_GRID
        serverUrl: https://nomads.ncep.noaa.gov:9090/dods/gfs_0p25/gfs%TIME_ZERO(yyyyMMdd)%/gfs_0p25_%TIME_ZERO(HH)%z
        idMapId: IdImportGFS
        unitConversionsId: ImportUnitConversions
        missingValue: -3.402823E38
        importTimeZone:
          timeZoneName: GMT
        dataFeedId: GFS.Server
      startTimeShift:
        parameterId: PC.nwp
        relativePeriod:
          unit: hour
          start: -3
          end: 0
      timeSeriesSet:
      - moduleInstanceId: ImportGFS
        valueType: grid
        parameterId: PC.nwp
        locationId: GFS
        timeSeriesType: external forecasting
        timeStep:
          unit: hour
          multiplier: 3
        readWriteMode: add originals
        synchLevel: 6
      - moduleInstanceId: ImportGFS
        valueType: grid
        parameterId: TA.nwp
        locationId: GFS
        timeSeriesType: external forecasting
        timeStep:
          unit: hour
          multiplier: 3
        readWriteMode: add originals
        synchLevel: 6
      externUnit:
      - parameterId: PC.nwp
        unit: mm
        cumulativeSum: true
      - parameterId: TA.nwp
        unit: K
- schema: Workflow
  output: WorkflowFiles/Import/NOAA/Import{{ nwp_name }}Grids.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: true
      moduleInstanceId: ImportGFS
contributions: []
