name: raven_basin
description: |
  Forecast + historic model run for one basin using the Raven adapter
  (Liard pattern). Files use FEWS runtime placeholders ($MODELNAME2$,
  $MODEL2_TIMESTEP$) so most content is basin-independent; the
  basin_name variable drives output paths only.
keywords: [raven, basin, model, forecast, historic, mesh]
when_to_use: |
  When using the Raven model adapter for a single basin. Each
  instance covers one basin (e.g. Liard).

variables:
  basin_name:
    type: str
    required: true
  historic_lookback_days:
    type: int
    default: 30
    description: |
      How many days back the historic run covers. Tutorial uses 30
      for Liard (Raven), 365 for Snare (wflow — different pattern).

# POC scope: just the historic workflow file. Forecast templates and
# per-NWP forecast workflows added in follow-up.
outputs:
  - schema: Workflow
    output: WorkflowFiles/ModelRun/{{ basin_name }}/Run{{ basin_name }}Historic.xml
    data:
      version: "1.1"
      properties:
        string:
          - {key: STARTTIME, value: "-{{ historic_lookback_days }}"}
          - {key: ENDTIME, value: "0"}
          - {key: INPUTTIMESERIES, value: ImportE2O}
          - {key: PARAMETER2, value: PC.obs}
          - {key: PARAMETER1, value: TA.obs}
          - {key: OUTPUTTIMESERIES, value: $MODELNAME2$Historic}
          - {key: INPUTMODULEINSTANCEMETEO, value: PreprocessE2O}
          - {key: PARAMETER3, value: QR.sim}
          - {key: TYPE1, value: external historical}
          - {key: TYPE2, value: simulated historical}
      activity:
        - runIndependent: true
          moduleInstanceId: $MODELNAME2$Historic
          moduleConfigFileName: $MODELNAME2$HistoricTemplate
        - properties:
            string:
              - {key: TIMESERIESTYPE, value: simulated historical}
              - {key: PARAMETER, value: QR.sim}
              - {key: ENSEMBLE, value: main}
              - {key: STATIONLOCATIONS, value: $MODELNAME2$HydroStations}
              - {key: TIMESTEP, value: $MODEL2_TIMESTEP$}
          runIndependent: true
          moduleInstanceId: $MODELNAME2$Historic
          moduleConfigFileName: PostprocessModelOutputToStationTemplate

# Minimal contributions for now — the basin's module instances are
# named via FEWS placeholders ($MODELNAME2$Historic), so they're not
# project-known until FEWS resolves the placeholder. We can't safely
# contribute them to ModuleInstanceDescriptors here.
contributions: []
