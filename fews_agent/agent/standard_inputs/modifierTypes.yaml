spatialCopyModifier:
- id: RDPSSpatialCopy
  name: RDPS Spatial Copy
  expiryTime:
    unit: day
    multiplier: 2
  timeSeries:
  - moduleInstanceId: ImportRDPS
    parameterId: PC.nwp
    locationId: RDPS
  - moduleInstanceId: ImportRDPS
    parameterId: TA.nwp
    locationId: RDPS
- id: REPSSpatialCopy
  name: REPS Spatial Copy
  expiryTime:
    unit: day
    multiplier: 2
  timeSeries:
  - moduleInstanceId: ImportREPS
    parameterId: PC.nwp
    locationId: REPS
  - moduleInstanceId: ImportREPS
    parameterId: TA.nwp
    locationId: REPS
spatialProfileModifier:
- id: RDPSSpatialProfile
  name: RDPS Spatial Profile
  expiryTime:
    unit: day
    multiplier: 2
  userDefinedDescriptionField:
    id: Comment
    descriptionField: Comment
  timeSeries:
  - moduleInstanceId: ImportRDPS
    parameterId: PC.nwp
  descriptiveFunctionGroups:
    descriptiveFunctionGroup:
    - name: Basic statistics
      descriptiveFunction:
      - function: startTime
        ignoreMissings: true
      - function: endTime
        ignoreMissings: true
      - function: timeLength
        ignoreMissings: true
    - name: Accumulation
      descriptiveFunction:
      - function: movingAccumulationMax
        ignoreMissings: true
        timeSpan:
        - unit: hour
          multiplier: 1
        - unit: hour
          multiplier: 2
        - unit: hour
          multiplier: 3
        - unit: hour
          multiplier: 4
        - unit: hour
          multiplier: 6
        - unit: hour
          multiplier: 12
        - unit: hour
          multiplier: 24
        - unit: hour
          multiplier: 48
      - function: sum
        ignoreMissings: true
- id: GDPSSpatialProfile
  name: GDPS Spatial Profile
  expiryTime:
    unit: day
    multiplier: 2
  userDefinedDescriptionField:
    id: Comment
    descriptionField: Comment
  timeSeries:
  - moduleInstanceId: ImportGDPS
    parameterId: PC.nwp
  - moduleInstanceId: ImportGDPS
    parameterId: TA.nwp
  descriptiveFunctionGroups:
    descriptiveFunctionGroup:
    - name: Basic statistics
      descriptiveFunction:
      - function: startTime
        ignoreMissings: true
      - function: endTime
        ignoreMissings: true
      - function: timeLength
        ignoreMissings: true
    - name: Accumulation
      descriptiveFunction:
      - function: movingAccumulationMax
        ignoreMissings: true
        timeSpan:
        - unit: hour
          multiplier: 1
        - unit: hour
          multiplier: 2
        - unit: hour
          multiplier: 3
        - unit: hour
          multiplier: 4
        - unit: hour
          multiplier: 6
        - unit: hour
          multiplier: 12
        - unit: hour
          multiplier: 24
        - unit: hour
          multiplier: 48
        - unit: hour
          multiplier: 72
        - unit: hour
          multiplier: 96
        - unit: hour
          multiplier: 120
      - function: sum
        ignoreMissings: true
