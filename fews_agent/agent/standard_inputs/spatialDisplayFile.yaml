body:
- title: Spatial Display
- defaults:
    plotGroupId: WSC_Scalar_Download
    geoMap:
      geoDatum: WGS 1984
      projection: web_mercator
      defaultExtent:
        '@id': $REGION$
        left: '-149'
        right: '-82'
        top: '71'
        bottom: '57'
      extraExtent:
      - '@id': $MODELNAME1$
        left: '-121'
        right: '-105'
        top: '66'
        bottom: '62.4'
      - '@id': $MODELNAME2$
        left: '-142'
        right: '-105'
        top: '64'
        bottom: '56'
      - '@id': Canada
        left: '-152'
        right: '-47'
        top: '40'
        bottom: '75'
      - '@id': World
        left: '-180'
        right: '180'
        top: '90'
        bottom: '-70'
      scaleBarVisible: 'true'
      northArrowVisible: 'true'
      labelsVisible: 'true'
      backgroundColor: white
      openStreetMapLayer:
        '@id': Open Street Map
        url: http://tile.openstreetmap.org
        visible: 'true'
        cacheDir: $MAPLAYERSCACHE_FOLDER$/OSM
      layer:
      - '@id': Satellite
        className: nl.wldelft.libx.openmap.GenericTileServerLayer
        visible: 'false'
        properties:
          string:
          - '@key': tileUrlPattern
            '@value': http://h%RIGHT(QUAD_KEY,1)%.ortho.tiles.virtualearth.net/tiles/h%QUAD_KEY%.jpeg?g=1
          - '@key': cacheDir
            '@value': $MAPLAYERSCACHE_FOLDER$/Satellite_Cache
          int:
          - '@key': minZoomLevel
            '@value': '2'
          - '@key': maxZoomLevel
            '@value': '17'
          - '@key': topZoomLevel
            '@value': '19'
          - '@key': tileSize
            '@value': '256'
      - '@id': Topografie
        '@name': ArcGIS World Topo Map
        className: nl.wldelft.libx.openmap.GenericTileServerLayer
        visible: 'true'
        properties:
          string:
          - '@key': tileUrlPattern
            '@value': http://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/%ZOOM%/%ROW%/%COLUMN%
          - '@key': cacheDir
            '@value': $MAPLAYERSCACHE_FOLDER$/Esri_topo
          int:
          - '@key': minZoomLevel
            '@value': '1'
          - '@key': maxZoomLevel
            '@value': '19'
          - '@key': topZoomLevel
            '@value': '21'
          - '@key': tileSize
            '@value': '256'
      - '@id': Canvas
        '@name': ArcGIS Canvas World LightGray Base
        className: nl.wldelft.libx.openmap.GenericTileServerLayer
        visible: 'false'
        properties:
          string:
          - '@key': tileUrlPattern
            '@value': http://server.arcgisonline.com/arcgis/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/%ZOOM%/%ROW%/%COLUMN%
          - '@key': cacheDir
            '@value': $MAPLAYERSCACHE_FOLDER$/Esri_Canvas_World_Light_Gray_Base
          int:
          - '@key': minZoomLevel
            '@value': '1'
          - '@key': maxZoomLevel
            '@value': '19'
          - '@key': topZoomLevel
            '@value': '21'
          - '@key': tileSize
            '@value': '256'
      - '@id': World
        '@name': ArcGIS World Satellite Map
        className: nl.wldelft.libx.openmap.GenericTileServerLayer
        visible: 'true'
        properties:
          string:
          - '@key': tileUrlPattern
            '@value': http://server.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/%ZOOM%/%ROW%/%COLUMN%
          - '@key': cacheDir
            '@value': $MAPLAYERSCACHE_FOLDER$/World_Imagery
          int:
          - '@key': minZoomLevel
            '@value': '1'
          - '@key': maxZoomLevel
            '@value': '19'
          - '@key': topZoomLevel
            '@value': '21'
          - '@key': tileSize
            '@value': '256'
      - '@id': NatGeo_World_Map
        '@name': ArcGIS Physical Map
        className: nl.wldelft.libx.openmap.GenericTileServerLayer
        visible: 'false'
        properties:
          string:
          - '@key': tileUrlPattern
            '@value': http://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/%ZOOM%/%ROW%/%COLUMN%
          - '@key': cacheDir
            '@value': $MAPLAYERSCACHE_FOLDER$/NatGeo_World_Map
          int:
          - '@key': minZoomLevel
            '@value': '1'
          - '@key': maxZoomLevel
            '@value': '14'
          - '@key': topZoomLevel
            '@value': '18'
          - '@key': tileSize
            '@value': '256'
      - '@id': World_Shaded_Relief
        '@name': ArcGIS Shaded Relief
        className: nl.wldelft.libx.openmap.GenericTileServerLayer
        visible: 'true'
        properties:
          string:
          - '@key': tileUrlPattern
            '@value': http://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/%ZOOM%/%ROW%/%COLUMN%
          - '@key': cacheDir
            '@value': $MAPLAYERSCACHE_FOLDER$/World_Shaded_Relief
          int:
          - '@key': minZoomLevel
            '@value': '1'
          - '@key': maxZoomLevel
            '@value': '14'
          - '@key': topZoomLevel
            '@value': '21'
          - '@key': tileSize
            '@value': '256'
      esriShapeLayer:
      - '@id': $MODELNAME1$Watersheds
        description: Watersheds
        file: $MODELNAME1$Watersheds.shp
        geoDatum: WGS 1984
        visible: 'true'
        lineColor: black
        fillRgbColor: FFFFFF
        opaquenessPercentage: '20'
      - '@id': $MODELNAME1$Rivers
        description: Rivers
        file: $MODELNAME1$Rivers.shp
        geoDatum: WGS 1984
        visible: 'false'
        lineColor: blue
        opaquenessPercentage: '20'
      - '@id': $MODELNAME1$Lakes
        description: Lakes
        file: $MODELNAME1$Lakes.shp
        geoDatum: WGS 1984
        visible: 'false'
        lineColor: blue
        fillColor: blue
        opaquenessPercentage: '20'
      - '@id': $MODELNAME2$Watersheds
        description: $MODELNAME2$Watersheds
        file: $MODELNAME2$Watersheds.shp
        geoDatum: WGS 1984
        visible: 'true'
        lineColor: black
        fillRgbColor: FFFFFF
        opaquenessPercentage: '20'
      - '@id': $MODELNAME2$Rivers
        description: $MODELNAME2$Rivers
        file: $MODELNAME2$Rivers.shp
        geoDatum: WGS 1984
        visible: 'false'
        lineColor: blue
        opaquenessPercentage: '20'
      - '@id': World Countries
        description: World
        file: WorldCountries.shp
        geoDatum: WGS 1984
        visible: 'false'
        toolTip: '%CNTRY_NAME%'
        lineColor: black
        fillRgbColor: FFFFFF
        opaquenessPercentage: '20'
    timeDisplayLabels: bottomRight
- defaults:
    commentPositioning: topLeft
- gridPlotGroup:
    '@id': E2O_Gridded_Data
    '@name': Earth2Observe Re-analysis Data
    gridPlot:
    - '@id': E2OCompleteGridPrecip
      '@name': Re-analysis Precipitation
      timeSeriesSet:
        moduleInstanceId: ImportE2O
        valueType: grid
        parameterId: PC.obs
        locationId: E2O_25
        timeSeriesType: external historical
        timeStep:
          '@id': $DAY_TIMESTEP$
        readWriteMode: read complete forecast
      showThumbnailsPanel: 'false'
      classBreaksId: Class.Precipitation
    - '@id': E2OCompleteGridTemp
      '@name': Re-analysis Temperature
      timeSeriesSet:
        moduleInstanceId: ImportE2O
        valueType: grid
        parameterId: TA.obs
        locationId: E2O_25
        timeSeriesType: external historical
        timeStep:
          '@id': $DAY_TIMESTEP$
        readWriteMode: read complete forecast
      showThumbnailsPanel: 'false'
      classBreaksId: Class.Temperature
    - '@id': E2OCompleteGridPET
      '@name': Re-analysis Potential ET
      timeSeriesSet:
        moduleInstanceId: ImportE2O
        valueType: grid
        parameterId: PET.obs
        locationId: E2O_25
        timeSeriesType: external historical
        timeStep:
          '@id': $DAY_TIMESTEP$
        readWriteMode: read complete forecast
      showThumbnailsPanel: 'false'
      classBreaksId: Class.Precipitation
- gridPlotGroup:
    '@id': WSC_Scalar_Download
    '@name': WSC Stations
    gridPlot:
    - '@id': RecentObservedDischarge
      '@name': ' Recent Discharge @ Local Stations [m3/s]'
      timeSeriesSet:
        moduleInstanceId: ImportWSC
        valueType: scalar
        parameterId: QR.obs
        locationSetId: DisplayHydroStations
        timeSeriesType: external historical
        timeStep:
          '@unit': minute
          '@multiplier': '5'
        relativeViewPeriod:
          '@unit': day
          '@start': '-15'
          '@end': '0'
        readWriteMode: add originals
      showThumbnailsPanel: 'false'
      classBreaksId: Class.Discharge
    - '@id': HistoricObservedDischarge
      '@name': ' Historic Discharge @ Local Stations [m3/s]'
      timeSeriesSet:
        moduleInstanceId: ImportWSC
        valueType: scalar
        parameterId: QR.obs
        locationSetId: DisplayHydroStations
        timeSeriesType: external historical
        timeStep:
          '@unit': day
          '@multiplier': '1'
        relativeViewPeriod:
          '@unit': day
          '@start': '-15'
          '@end': '0'
        readWriteMode: add originals
      showThumbnailsPanel: 'false'
      classBreaksId: Class.Discharge
- gridPlotGroup:
    '@id': ECCC_Scalar_Download
    '@name': ECCC Meteo Stations
    gridPlot:
    - '@id': PrecipitationECCC
      '@name': Precipitation Daily @ Stations [mm]
      dataLayer:
        onlyCircles: 'true'
        circleSizeFunction: '12'
        circleBorderSize: '1'
        circleBorderColor: gray
        timeSeriesSet:
          moduleInstanceId: ImportECCCScalar
          valueType: scalar
          parameterId: PC.obs
          locationSetId: DisplayMeteoStations
          timeSeriesType: external historical
          timeStep:
            '@id': $DAY_TIMESTEP$
          relativeViewPeriod:
            '@unit': day
            '@start': '-15'
            '@end': '0'
          readWriteMode: read only
      showThumbnailsPanel: 'false'
      movieFrameDurationMillis: '200'
      movingAccumulationTimeSpan:
      - '@unit': day
        '@multiplier': '1'
      - '@unit': day
        '@multiplier': '2'
      - '@unit': day
        '@multiplier': '3'
      - '@unit': day
        '@multiplier': '4'
      - '@unit': day
        '@multiplier': '5'
      - '@unit': day
        '@multiplier': '8'
      classBreaksId: Class.Precipitation
    - '@id': TemperatureMaxECCC
      '@name': Temperature Max Daily @ Stations [oC]
      dataLayer:
        onlyCircles: 'true'
        circleSizeFunction: '12'
        circleBorderSize: '1'
        circleBorderColor: gray
        timeSeriesSet:
          moduleInstanceId: ImportECCCScalar
          valueType: scalar
          parameterId: TA.obs
          qualifierId: max
          locationSetId: DisplayMeteoStations
          timeSeriesType: external historical
          timeStep:
            '@id': $DAY_TIMESTEP$
          relativeViewPeriod:
            '@unit': day
            '@start': '-15'
            '@end': '0'
          readWriteMode: read only
    - '@id': TemperatureMinECCC
      '@name': Temperature Min Daily @ Stations [oC]
      dataLayer:
        onlyCircles: 'true'
        circleSizeFunction: '12'
        circleBorderSize: '1'
        circleBorderColor: gray
        timeSeriesSet:
          moduleInstanceId: ImportECCCScalar
          valueType: scalar
          parameterId: TA.obs
          qualifierId: min
          locationSetId: DisplayMeteoStations
          timeSeriesType: external historical
          timeStep:
            '@unit': nonequidistant
          relativeViewPeriod:
            '@unit': day
            '@start': '-15'
            '@end': '0'
          readWriteMode: read only
      classBreaksId: Class.Temperature
    - '@id': TemperatureHourlyECCC
      '@name': Temperature Hourly @ Stations [oC]
      dataLayer:
        onlyCircles: 'true'
        circleSizeFunction: '12'
        circleBorderSize: '1'
        circleBorderColor: gray
        timeSeriesSet:
          moduleInstanceId: ImportECCCScalar
          valueType: scalar
          parameterId: TA.obs
          locationSetId: DisplayMeteoStations
          timeSeriesType: external historical
          timeStep:
            '@unit': nonequidistant
          relativeViewPeriod:
            '@unit': day
            '@start': '-15'
            '@end': '0'
          readWriteMode: read only
      classBreaksId: Class.Temperature
- gridPlotGroup:
    '@id': ECCC_Grid
    '@name': ECCC Grids - GeoMet
    gridPlotGroup:
    - '@id': RDPA
      '@name': RDPA
      gridPlot:
        '@id': RDPAPrecipitation
        '@name': Precipitation [mm]
        timeSeriesSet:
          moduleInstanceId: ImportRDPA
          valueType: grid
          parameterId: PC.sim
          locationId: RDPA
          timeSeriesType: external historical
          timeStep:
            '@unit': hour
            '@multiplier': '6'
          readWriteMode: read complete forecast
        showThumbnailsPanel: 'false'
        numberOfRecentForecasts: '3'
        movieFrameDurationMillis: '200'
        classBreaksId: Class.Precipitation
    - '@id': RDPS
      '@name': RDPS Forecast
      gridPlot:
      - '@id': 'RDPSPrecipitation '
        '@name': Precipitation (mm)
        timeSeriesSet:
          moduleInstanceId: ImportRDPS
          valueType: grid
          parameterId: PC.nwp
          locationId: RDPS
          timeSeriesType: external forecasting
          timeStep:
            '@unit': hour
            '@multiplier': '3'
          readWriteMode: read complete forecast
        showThumbnailsPanel: 'true'
        numberOfRecentForecasts: '3'
        classBreaksId: Class.Precipitation
      - '@id': 'RDPSTemperature '
        '@name': Temperature (C)
        timeSeriesSet:
          moduleInstanceId: ImportRDPS
          valueType: grid
          parameterId: TA.nwp
          locationId: RDPS
          timeSeriesType: external forecasting
          timeStep:
            '@unit': hour
            '@multiplier': '3'
          readWriteMode: read complete forecast
        showThumbnailsPanel: 'true'
        numberOfRecentForecasts: '4'
        classBreaksId: Class.Temperature
    - '@id': GDPS
      '@name': GDPS Forecast
      gridPlot:
      - '@id': 'GDPSPrecipitation '
        '@name': Precipitation (mm)
        timeSeriesSet:
          moduleInstanceId: ImportGDPS
          valueType: grid
          parameterId: PC.nwp
          locationId: GDPS
          timeSeriesType: external forecasting
          timeStep:
            '@unit': hour
            '@multiplier': '3'
          readWriteMode: read complete forecast
        showThumbnailsPanel: 'true'
        numberOfRecentForecasts: '3'
        movieFrameDurationMillis: '200'
        classBreaksId: Class.Precipitation
      - '@id': 'GDPSTemperature '
        '@name': "Temperature (\xB0C)"
        timeSeriesSet:
          moduleInstanceId: ImportGDPS
          valueType: grid
          parameterId: TA.nwp
          locationId: GDPS
          timeSeriesType: external forecasting
          timeStep:
            '@unit': hour
            '@multiplier': '3'
          readWriteMode: read complete forecast
        showThumbnailsPanel: 'true'
        numberOfRecentForecasts: '4'
        classBreaksId: Class.Temperature
    - '@id': REPS
      '@name': REPS Forecast
      gridPlot:
      - '@id': 'REPSPrecipitation '
        '@name': Precipitation (mm)
        timeSeriesSet:
          moduleInstanceId: ImportREPS
          valueType: grid
          parameterId: PC.nwp
          locationId: REPS
          timeSeriesType: external forecasting
          timeStep:
            '@unit': hour
            '@multiplier': '3'
          readWriteMode: read complete forecast
          ensembleId: REPS
        showThumbnailsPanel: 'true'
        numberOfRecentForecasts: '3'
        movieFrameDurationMillis: '200'
        classBreaksId: Class.Precipitation
      - '@id': 'REPSTemperature '
        '@name': "Temperature (\xB0C)"
        timeSeriesSet:
          moduleInstanceId: ImportREPS
          valueType: grid
          parameterId: TA.nwp
          locationId: REPS
          timeSeriesType: external forecasting
          timeStep:
            '@unit': hour
            '@multiplier': '3'
          readWriteMode: read complete forecast
          ensembleId: REPS
        showThumbnailsPanel: 'true'
        numberOfRecentForecasts: '4'
        classBreaksId: Class.Temperature
- gridPlotGroup:
    '@id': ECCC_Processed
    '@name': ECCC Grids - Processed
    gridPlotGroup:
    - '@id': RDPAPreprocess
      '@name': RDPA
      gridPlot:
        '@id': RDPSPreprocessPrecipitation
        '@name': Precipitation [mm]
        timeSeriesSet:
          moduleInstanceId: PreprocessRDPA
          valueType: scalar
          parameterId: PC.sim
          locationSetId: ModelBasins
          timeSeriesType: external historical
          timeStep:
            '@unit': hour
            '@multiplier': '6'
          relativeViewPeriod:
            '@unit': day
            '@start': '-7'
            '@end': '0'
          readWriteMode: add originals
        showThumbnailsPanel: 'false'
        numberOfRecentForecasts: '3'
        movieFrameDurationMillis: '200'
        movingAccumulationTimeSpan:
        - '@unit': day
          '@multiplier': '1'
        - '@unit': day
          '@multiplier': '2'
        - '@unit': day
          '@multiplier': '3'
        - '@unit': day
          '@multiplier': '4'
        - '@unit': day
          '@multiplier': '5'
        - '@unit': day
          '@multiplier': '8'
        classBreaksId: Class.Precipitation
    - '@id': RDPSPreprocess
      '@name': RDPS Forecast
      gridPlot:
      - '@id': 'RDPSPreprocessPrecipitation '
        '@name': Precipitation [mm]
        timeSeriesSet:
          moduleInstanceId: PreprocessRDPS
          valueType: scalar
          parameterId: PC.nwp
          locationSetId: ModelBasins
          timeSeriesType: external forecasting
          timeStep:
            '@unit': hour
            '@multiplier': '3'
          readWriteMode: read complete forecast
        showThumbnailsPanel: 'true'
        numberOfRecentForecasts: '3'
        movieFrameDurationMillis: '200'
        movingAccumulationTimeSpan:
        - '@unit': day
          '@multiplier': '1'
        - '@unit': day
          '@multiplier': '2'
        - '@unit': day
          '@multiplier': '3'
        - '@unit': day
          '@multiplier': '4'
        - '@unit': day
          '@multiplier': '5'
        - '@unit': day
          '@multiplier': '8'
        classBreaksId: Class.Precipitation
      - '@id': 'RDPSPreprocessTemperature  '
        '@name': "Temperature (\xB0C)"
        timeSeriesSet:
          moduleInstanceId: PreprocessRDPS
          valueType: scalar
          parameterId: TA.nwp
          locationSetId: ModelBasins
          timeSeriesType: external forecasting
          timeStep:
            '@unit': hour
            '@multiplier': '3'
          readWriteMode: read complete forecast
        showThumbnailsPanel: 'true'
        numberOfRecentForecasts: '4'
        classBreaksId: Class.Temperature
    - '@id': GDPSPreprocess
      '@name': GDPS Forecast
      gridPlot:
      - '@id': 'GDPSPreprocessPrecipitation '
        '@name': Precipitation [mm]
        timeSeriesSet:
          moduleInstanceId: PreprocessGDPS
          valueType: scalar
          parameterId: PC.nwp
          locationSetId: ModelBasins
          timeSeriesType: external forecasting
          timeStep:
            '@unit': hour
            '@multiplier': '3'
          readWriteMode: read complete forecast
        showThumbnailsPanel: 'true'
        numberOfRecentForecasts: '3'
        movieFrameDurationMillis: '200'
        movingAccumulationTimeSpan:
        - '@unit': day
          '@multiplier': '1'
        - '@unit': day
          '@multiplier': '2'
        - '@unit': day
          '@multiplier': '3'
        - '@unit': day
          '@multiplier': '4'
        - '@unit': day
          '@multiplier': '5'
        - '@unit': day
          '@multiplier': '8'
        classBreaksId: Class.Precipitation
      - '@id': 'GDPSPreprocessTemperature  '
        '@name': "Temperature (\xB0C)"
        timeSeriesSet:
          moduleInstanceId: PreprocessGDPS
          valueType: scalar
          parameterId: TA.nwp
          locationSetId: ModelBasins
          timeSeriesType: external forecasting
          timeStep:
            '@unit': hour
            '@multiplier': '3'
          readWriteMode: read complete forecast
        showThumbnailsPanel: 'true'
        numberOfRecentForecasts: '4'
        classBreaksId: Class.Temperature
    - '@id': REPSPreprocess
      '@name': REPS Forecast
      gridPlot:
      - '@id': 'REPSPreprocessPrecipitation '
        '@name': 'Precipitation (mm) '
        timeSeriesSet:
          moduleInstanceId: PreprocessREPS
          valueType: scalar
          parameterId: PC.nwp
          locationSetId: ModelBasins
          timeSeriesType: external forecasting
          timeStep:
            '@unit': hour
            '@multiplier': '3'
          readWriteMode: read complete forecast
          ensembleId: REPS
        showThumbnailsPanel: 'true'
        numberOfRecentForecasts: '2'
        movieFrameDurationMillis: '200'
        classBreaksId: Class.Precipitation
      - '@id': 'REPSPreprocessTemperature  '
        '@name': "Temperature (\xB0C) "
        timeSeriesSet:
          moduleInstanceId: PreprocessREPS
          valueType: scalar
          parameterId: TA.nwp
          locationSetId: ModelBasins
          timeSeriesType: external forecasting
          timeStep:
            '@unit': hour
            '@multiplier': '3'
          readWriteMode: read complete forecast
          ensembleId: REPS
        showThumbnailsPanel: 'true'
        numberOfRecentForecasts: '2'
        classBreaksId: Class.Temperature
- gridPlotGroup:
    '@id': $MODELNAME1$_Results
    '@name': '$MODELNAME1$ '
    gridPlotGroup:
    - '@id': $MODELNAME1$Historic
      '@name': Historic Model Run
      gridPlotGroup:
      - '@id': HistoricInput$MODELNAME1$
        '@name': Input Data
        gridPlot:
        - '@id': HistoricPrecipitationInput$MODELNAME1$
          '@name': Precipitation (mm)
          timeSeriesSet:
            moduleInstanceId: $MODELNAME1$Historic
            valueType: grid
            parameterId: PC.sim
            locationId: $MODELNAME1$Grid
            timeSeriesType: simulated historical
            timeStep:
              '@id': $MODEL1_TIMESTEP$
            readWriteMode: read complete forecast
          movieFrameDurationMillis: '200'
          classBreaksId: Class.Precipitation
        - '@id': HistoricTemperatureInput$MODELNAME1$
          '@name': "Temperature  (\xB0C)"
          timeSeriesSet:
            moduleInstanceId: $MODELNAME1$Historic
            valueType: grid
            parameterId: TA.sim
            locationId: $MODELNAME1$Grid
            timeSeriesType: simulated historical
            timeStep:
              '@id': $MODEL1_TIMESTEP$
            relativeViewPeriod:
              '@unit': day
              '@start': '-90'
              '@end': '0'
            readWriteMode: read complete forecast
          classBreaksId: Class.Temperature
        - '@id': HistoricPETInput$MODELNAME1$
          '@name': Potential Evaporation (mm)
          timeSeriesSet:
            moduleInstanceId: $MODELNAME1$Historic
            valueType: grid
            parameterId: PET.sim
            locationId: $MODELNAME1$Grid
            timeSeriesType: simulated historical
            timeStep:
              '@id': $MODEL1_TIMESTEP$
            readWriteMode: read complete forecast
          classBreaksId: Class.Temperature
      - '@id': HistoricGridResult$MODELNAME1$
        '@name': Gridded Results
        gridPlot:
        - '@id': HistoricGridResultQR$MODELNAME1$
          '@name': Outflow [m3/s]
          timeSeriesSet:
            moduleInstanceId: $MODELNAME1$Historic
            valueType: grid
            parameterId: QR.sim
            locationId: $MODELNAME1$Grid
            timeSeriesType: simulated historical
            timeStep:
              '@id': $MODEL1_TIMESTEP$
            readWriteMode: read complete forecast
          classBreaksId: Class.Discharge
        - '@id': HistoricGridResultSWE$MODELNAME1$
          '@name': SWE [mm]
          timeSeriesSet:
            moduleInstanceId: $MODELNAME1$Historic
            valueType: grid
            parameterId: SWE.sim
            locationId: $MODELNAME1$Grid
            timeSeriesType: simulated historical
            timeStep:
              '@id': $MODEL1_TIMESTEP$
            readWriteMode: read complete forecast
          classBreaksId: Class.SWE
      - '@id': 'HistoricScalarResult$MODELNAME1$ '
        '@name': Station Results
        gridPlot:
          '@id': HistoricScalarResultQR$MODELNAME1$
