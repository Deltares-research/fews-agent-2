version: '1.1'
validationRuleSet:
- validationRuleSetId: MeteoStations_Precip
  timeZone: '0'
  extremeValues:
    hardMax:
      constantLimit: '500'
    hardMin:
      constantLimit: '0'
    softMax:
      constantLimit: '250'
  timeSeriesSet:
  - moduleInstanceId: ImportECCCScalar
    valueType: scalar
    parameterId: PC.obs
    locationSetId: ECCCStations
    timeSeriesType: external historical
    timeStep:
      unit: day
    readWriteMode: add originals
