body:
- defaultFilterId: HydroStations
- timeSeriesSets:
    '@id': HydroStations
    timeSeriesSet:
    - moduleInstanceId: ImportWSC
      valueType: scalar
      parameterId: HG.obs
      locationSetId: DisplayHydroStations
      timeSeriesType: external historical
      timeStep:
        '@unit': minute
        '@multiplier': '5'
      relativeViewPeriod:
        '@unit': day
        '@start': '-5'
        '@end': '0'
      readWriteMode: add originals
      synchLevel: '5'
    - moduleInstanceId: ImportWSC
      valueType: scalar
      parameterId: QR.obs
      locationSetId: DisplayHydroStations
      timeSeriesType: external historical
      timeStep:
        '@unit': minute
        '@multiplier': '5'
      relativeViewPeriod:
        '@unit': day
        '@start': '-5'
        '@end': '0'
      readWriteMode: add originals
      synchLevel: '5'
- timeSeriesSets:
    '@id': MeteoStations
    timeSeriesSet:
    - moduleInstanceId: ImportECCCScalar
      valueType: scalar
      parameterId: PC.obs
      locationSetId: DisplayMeteoStations
      timeSeriesType: external historical
      timeStep:
        '@id': $DAY_TIMESTEP$
      relativeViewPeriod:
        '@unit': day
        '@start': '-5'
        '@end': '0'
      readWriteMode: add originals
      synchLevel: '5'
    - moduleInstanceId: ImportECCCScalar
      valueType: scalar
      parameterId: TA.obs
      qualifierId: max
      locationSetId: DisplayMeteoStations
      timeSeriesType: external historical
      timeStep:
        '@id': $DAY_TIMESTEP$
      relativeViewPeriod:
        '@unit': day
        '@start': '-5'
        '@end': '0'
      readWriteMode: add originals
      synchLevel: '5'
    - moduleInstanceId: ImportECCCScalar
      valueType: scalar
      parameterId: TA.obs
      qualifierId: min
      locationSetId: DisplayMeteoStations
      timeSeriesType: external historical
      timeStep:
        '@id': $DAY_TIMESTEP$
      relativeViewPeriod:
        '@unit': day
        '@start': '-5'
        '@end': '0'
      readWriteMode: add originals
      synchLevel: '5'
    - moduleInstanceId: ImportECCCScalar
      valueType: scalar
      parameterId: TA.obs
      locationSetId: DisplayMeteoStations
      timeSeriesType: external historical
      timeStep:
        '@unit': hour
        '@multiplier': '1'
      relativeViewPeriod:
        '@unit': day
        '@start': '-5'
        '@end': '0'
      readWriteMode: add originals
      synchLevel: '5'
- timeSeriesSets:
    '@id': RDPABasins
    timeSeriesSet:
      moduleInstanceId: PreprocessRDPA
      valueType: scalar
      parameterId: PC.sim
      locationSetId: ModelBasins
      timeSeriesType: external historical
      timeStep:
        '@unit': hour
        '@multiplier': '1'
      readWriteMode: read complete forecast
- timeSeriesSets:
    '@id': RDPSBasins
    timeSeriesSet:
    - moduleInstanceId: PreprocessRDPS
      valueType: scalar
      parameterId: PC.nwp
      locationSetId: ModelBasins
      timeSeriesType: external forecasting
      timeStep:
        '@unit': hour
        '@multiplier': '1'
      readWriteMode: read complete forecast
    - moduleInstanceId: PreprocessRDPS
      valueType: scalar
      parameterId: TA.nwp
      locationSetId: ModelBasins
      timeSeriesType: external forecasting
      timeStep:
        '@unit': hour
        '@multiplier': '1'
      readWriteMode: read complete forecast
- timeSeriesSets:
    '@id': GDPSBasins
    timeSeriesSet:
    - moduleInstanceId: PreprocessGDPS
      valueType: scalar
      parameterId: PC.nwp
      locationSetId: ModelBasins
      timeSeriesType: external forecasting
      timeStep:
        '@unit': hour
        '@multiplier': '3'
      readWriteMode: read complete forecast
    - moduleInstanceId: PreprocessGDPS
      valueType: scalar
      parameterId: TA.nwp
      locationSetId: ModelBasins
      timeSeriesType: external forecasting
      timeStep:
        '@unit': hour
        '@multiplier': '3'
      readWriteMode: read complete forecast
- timeSeriesSets:
    '@id': REPSBasins
    timeSeriesSet:
    - moduleInstanceId: PreprocessREPS
      valueType: scalar
      parameterId: PC.nwp
      locationSetId: ModelBasins
      timeSeriesType: external forecasting
      timeStep:
        '@unit': hour
        '@multiplier': '3'
      readWriteMode: read complete forecast
      ensembleId: REPS
    - moduleInstanceId: PreprocessREPS
      valueType: scalar
      parameterId: TA.nwp
      locationSetId: ModelBasins
      timeSeriesType: external forecasting
      timeStep:
        '@unit': hour
        '@multiplier': '3'
      readWriteMode: read complete forecast
      ensembleId: REPS
- timeSeriesSets:
    '@id': RDPAStations
    timeSeriesSet:
      moduleInstanceId: PreprocessRDPA
      valueType: scalar
      parameterId: PC.sim
      locationSetId: DisplayMeteoStations
      timeSeriesType: external historical
      timeStep:
