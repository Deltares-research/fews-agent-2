        '@multiplier': '1'
      readWriteMode: read complete forecast
- timeSeriesSets:
    '@id': RDPSStations
    timeSeriesSet:
    - moduleInstanceId: PreprocessRDPS
      valueType: scalar
      parameterId: PC.nwp
      locationSetId: DisplayMeteoStations
      timeSeriesType: external forecasting
      timeStep:
        '@unit': hour
        '@multiplier': '1'
      readWriteMode: read complete forecast
    - moduleInstanceId: PreprocessRDPS
      valueType: scalar
      parameterId: TA.nwp
      locationSetId: DisplayMeteoStations
      timeSeriesType: external forecasting
      timeStep:
        '@unit': hour
        '@multiplier': '1'
      readWriteMode: read complete forecast
- timeSeriesSets:
    '@id': GDPSStations
    timeSeriesSet:
    - moduleInstanceId: PreprocessGDPS
      valueType: scalar
      parameterId: PC.nwp
      locationSetId: DisplayMeteoStations
      timeSeriesType: external forecasting
      timeStep:
        '@unit': hour
        '@multiplier': '3'
      readWriteMode: read complete forecast
    - moduleInstanceId: PreprocessGDPS
      valueType: scalar
      parameterId: TA.nwp
      locationSetId: DisplayMeteoStations
      timeSeriesType: external forecasting
      timeStep:
        '@unit': hour
        '@multiplier': '3'
      readWriteMode: read complete forecast
- timeSeriesSets:
    '@id': REPSStations
    timeSeriesSet:
    - moduleInstanceId: PreprocessREPS
      valueType: scalar
      parameterId: PC.nwp
      locationSetId: DisplayMeteoStations
      timeSeriesType: external forecasting
      timeStep:
        '@unit': hour
        '@multiplier': '3'
      readWriteMode: read complete forecast
      ensembleId: REPS
    - moduleInstanceId: PreprocessREPS
      valueType: scalar
      parameterId: TA.nwp
      locationSetId: DisplayMeteoStations
      timeSeriesType: external forecasting
      timeStep:
        '@unit': hour
        '@multiplier': '3'
      readWriteMode: read complete forecast
      ensembleId: REPS
- filter:
    '@id': MeasuredData
    '@name': Measured Data
    mapExtentId: $REGION$
    child:
    - '@foreignKey': HydroStations
    - '@foreignKey': MeteoStations
- filter:
    '@id': ForecastDataStation
    '@name': Forecast Data - By Station
    mapExtentId: $REGION$
    child:
    - '@foreignKey': RDPAStations
    - '@foreignKey': RDPSStations
    - '@foreignKey': GDPSStations
    - '@foreignKey': REPSStations
- filter:
    '@id': ForecastDataBasin
    '@name': Forecast Data - By Basin
    mapExtentId: $REGION$
    child:
    - '@foreignKey': RDPABasins
    - '@foreignKey': RDPSBasins
    - '@foreignKey': GDPSBasins
    - '@foreignKey': REPSBasins
- filter:
    '@id': HydroStations
    '@name': Hydro Stations
    validationIconsVisible: 'false'
    timeSeriesSetsId: HydroStations
- filter:
