name: tpl_merge_e2o_precip
description: 'Auto-derived pattern from tutorial instances: MergeE2OPrecip.'
variables:
  template_name:
    type: str
    required: true
outputs:
- schema: TransformationModule
  output: ModuleConfigFiles/Preprocess/GriddedData/{{ template_name }}.xml
  data:
    version: '1.0'
    variable:
    - variableId: P_E2O_Snow
      timeSeriesSet:
        moduleInstanceId: ImportE2O
        valueType: grid
        parameterId: PC.obs
        qualifierId: snowonly
        locationId: E2O_25
        timeSeriesType: external historical
        timeStep:
          unit: day
        relativeViewPeriod:
          unit: day
          start: $STARTTIME$
          end: $ENDTIME$
          startOverrulable: true
        readWriteMode: read only
    - variableId: P_E2O_Rain
      timeSeriesSet:
        moduleInstanceId: ImportE2O
        valueType: grid
        parameterId: PC.obs
        qualifierId: rainonly
        locationId: E2O_25
        timeSeriesType: external historical
        timeStep:
          unit: day
        relativeViewPeriod:
          unit: day
          start: $STARTTIME$
          end: $ENDTIME$
          startOverrulable: true
        readWriteMode: read only
    - variableId: P_E2O_Out
      timeSeriesSet:
        moduleInstanceId: ImportE2O
        valueType: grid
        parameterId: PC.obs
        locationId: E2O_25
        timeSeriesType: external historical
        timeStep:
          unit: day
        relativeViewPeriod:
          unit: day
          start: $STARTTIME$
          end: $ENDTIME$
          startOverrulable: true
        readWriteMode: add originals
    transformation:
    - id: P_E2O_combine
      body:
        user:
          simple:
            expression: P_E2O_Snow + P_E2O_Rain
            outputVariable:
              variableId: P_E2O_Out
contributions: []
