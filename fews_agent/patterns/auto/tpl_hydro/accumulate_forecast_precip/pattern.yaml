name: tpl_accumulate_forecast_precip
description: 'Auto-derived pattern from tutorial instances: AccumulateForecastPrecipTemplate.'
variables:
  template_name:
    type: str
    required: true
outputs:
- schema: TransformationModule
  output: ModuleConfigFiles/Preprocess/ScalarData/{{ template_name }}.xml
  data:
    version: '1.0'
    variable:
    - variableId: input_precip
      timeSeriesSet:
        moduleInstanceId: $INPUTMODULEINSTANCE$
        valueType: scalar
        parameterId: $INPUTPARAMETER$
        locationSetId: $LOCATIONSET$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: accum_precip
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: $ACCUMPARAMETER$
        locationSetId: $LOCATIONSET$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    transformation:
    - id: accum_precip_transformation
      body:
        accumulation:
          sum:
            inputVariable:
              variableId: input_precip
            ignoreMissing: 'true'
            outputVariable:
              variableId: accum_precip
contributions: []
