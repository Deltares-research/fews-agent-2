name: tpl_modify_forecast_grids
description: 'Auto-derived pattern from tutorial instances: ModifyForecastGridsTemplate.'
variables:
  template_name:
    type: str
    required: true
outputs:
- schema: TransformationModule
  output: ModuleConfigFiles/Preprocess/ModifyData/{{ template_name }}.xml
  data:
    version: '1.0'
    variable:
    - variableId: Forecast_PC
      timeSeriesSet:
        moduleInstanceId: $FORECASTMODULEINSTANCE$
        valueType: grid
        parameterId: PC.nwp
        locationId: $MODELNAME1$Grid
        timeSeriesType: external forecasting
        timeStep:
          id: $TIMESTEP$
        readWriteMode: read complete forecast
    - variableId: Forecast_TA
      timeSeriesSet:
        moduleInstanceId: $FORECASTMODULEINSTANCE$
        valueType: grid
        parameterId: TA.nwp
        locationId: $MODELNAME1$Grid
        timeSeriesType: external forecasting
        timeStep:
          id: $TIMESTEP$
        readWriteMode: read complete forecast
    - variableId: PC_NWP_multiplier
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: PC.nwp.multiplier
        locationId: $MODELNAME1$Grid
        timeSeriesType: external historical
        timeStep:
          id: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: main
    - variableId: PC_NWP_multiplier_grid
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: grid
        parameterId: PC.nwp.multiplier
        locationId: $MODELNAME1$Grid
        timeSeriesType: temporary
        timeStep:
          id: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: main
    - variableId: TA_NWP_incrementer
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: TA.nwp.incrementer
        locationId: $MODELNAME1$Grid
        timeSeriesType: external historical
        timeStep:
          id: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: main
    - variableId: TA_NWP_incrementer_grid
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: grid
        parameterId: TA.nwp.incrementer
        locationId: $MODELNAME1$Grid
        timeSeriesType: temporary
        timeStep:
          id: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: main
    - variableId: Forecast_PC_mod
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: grid
        parameterId: PC.nwp
        locationId: $MODELNAME1$Grid
        timeSeriesType: simulated forecasting
        timeStep:
          id: $TIMESTEP$
        readWriteMode: read complete forecast
    - variableId: Forecast_TA_mod
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: grid
        parameterId: TA.nwp
        locationId: $MODELNAME1$Grid
        timeSeriesType: simulated forecasting
        timeStep:
          id: $TIMESTEP$
        readWriteMode: read complete forecast
    transformation:
    - id: PC_muliplier_NWP
      body:
        user:
          simple:
            expression: '1 '
            outputVariable:
              variableId: PC_NWP_multiplier
    - id: PC_muliplier_NWP_grid
      body:
        interpolationSpatial:
          closestDistance:
            inputVariable:
              variableId: PC_NWP_multiplier
            distanceGeoDatum: $DISTANCEGEODATUM$
            outputVariable:
              variableId: PC_NWP_multiplier_grid
    - id: PC_muliplier_NWP_applied
      body:
        user:
          simple:
            expression: 'Forecast_PC * PC_NWP_multiplier_grid '
            outputVariable:
              variableId: Forecast_PC_mod
    - id: TA_incrementer_NWP
      body:
        user:
          simple:
            expression: '0'
            outputVariable:
              variableId: TA_NWP_incrementer
    - id: TA_incrementer_NWP_grid
      body:
        interpolationSpatial:
          closestDistance:
            inputVariable:
              variableId: TA_NWP_incrementer
            distanceGeoDatum: $DISTANCEGEODATUM$
            outputVariable:
              variableId: TA_NWP_incrementer_grid
    - id: TA_incrementer_NWP_applied
      body:
        user:
          simple:
            expression: Forecast_TA + TA_NWP_incrementer_grid
            outputVariable:
              variableId: Forecast_TA_mod
contributions: []
