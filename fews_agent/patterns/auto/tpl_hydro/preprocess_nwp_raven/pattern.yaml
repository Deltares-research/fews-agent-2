name: tpl_preprocess_nwp_raven
description: 'Auto-derived pattern from tutorial instances: PreprocessNWPRavenTemplate.'
variables:
  template_name:
    type: str
    required: true
outputs:
- schema: TransformationModule
  output: ModuleConfigFiles/Preprocess/RavenModelData/{{ template_name }}.xml
  data:
    version: '1.0'
    variable:
    - variableId: gridded_precip
      timeSeriesSet:
        moduleInstanceId: $INPUTMODULEINSTANCE$
        valueType: grid
        parameterId: PC.nwp
        locationId: $INPUTGRID$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: gridded_temperature
      timeSeriesSet:
        moduleInstanceId: $INPUTMODULEINSTANCE$
        valueType: grid
        parameterId: TA.nwp
        locationId: $INPUTGRID$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: basin_precip
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: PC.nwp
        locationSetId: $BASINLOCATIONS$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          id: $MODEL2_TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: basin_precip_daily
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: PC.nwp
        locationSetId: $BASINLOCATIONS$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          id: $MODEL2_TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: station_precip
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: PC.nwp
        locationSetId: $STATIONLOCATIONS$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: basin_temperature
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: TA.nwp
        locationSetId: $BASINLOCATIONS$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: basin_temperature_daily
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: TA.nwp
        locationSetId: $BASINLOCATIONS$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          id: $MODEL2_TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: basin_temperature_daily_max
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: TA.nwp
        qualifierId: max
        locationSetId: $BASINLOCATIONS$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          id: $MODEL2_TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: basin_temperature_daily_min
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: TA.nwp
        qualifierId: min
        locationSetId: $BASINLOCATIONS$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          id: $MODEL2_TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: station_temperature
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: TA.nwp
        locationSetId: $STATIONLOCATIONS$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    transformation:
    - id: basin_precip
      body:
        interpolationSpatial:
          average:
            inputVariable:
              variableId: gridded_precip
            outputVariable:
              variableId: basin_precip
    - id: basin_precip_daily
      body:
        aggregation:
          accumulative:
            inputVariable:
              variableId: basin_precip
            outputVariable:
              variableId: basin_precip_daily
    - id: station_precip
      body:
        interpolationSpatial:
          closestDistance:
            inputVariable:
              variableId: gridded_precip
            distanceGeoDatum: $DISTANCEGEODATUM$
            outputVariable:
              variableId: station_precip
    - id: basin_temperature
      body:
        interpolationSpatial:
          average:
            inputVariable:
              variableId: gridded_temperature
            outputVariable:
              variableId: basin_temperature
    - id: basin_temperature_daily
      body:
        aggregation:
          accumulative:
            inputVariable:
              variableId: basin_temperature
            outputVariable:
              variableId: basin_temperature_daily
    - id: basin_temp_daily_max
      body:
        statisticsSerial:
          max:
            inputVariable:
              variableId: basin_temperature
            outputVariable:
              variableId: basin_temperature_daily_max
    - id: basin_temp_daily_min
      body:
        statisticsSerial:
          min:
            inputVariable:
              variableId: basin_temperature
            outputVariable:
              variableId: basin_temperature_daily_min
    - id: station_temperature
      body:
        interpolationSpatial:
          closestDistance:
            inputVariable:
              variableId: gridded_temperature
            distanceGeoDatum: $DISTANCEGEODATUM$
            outputVariable:
              variableId: station_temperature
contributions: []
