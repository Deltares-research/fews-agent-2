name: tpl_postprocess_to_station
description: 'Auto-derived pattern from tutorial instances: PostprocessModelOutputToStationTemplate.'
variables:
  template_name:
    type: str
    required: true
  # locationId for the Gridded_parameter timeSeriesSet. Default
  # preserves the tutorial's `$MODELNAME1$Grid` placeholder (FEWS
  # resolves it at startup). Override to a literal (e.g. "GFS") when
  # the template is used downstream of a bare NWP import that doesn't
  # carry the model-name placeholder convention.
  grid_locationid:
    type: str
    required: false
    default: $MODELNAME1$Grid
outputs:
- schema: TransformationModule
  output: ModuleConfigFiles/Postprocess/Model/{{ template_name }}.xml
  data:
    version: '1.0'
    variable:
    - variableId: Gridded_parameter
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: grid
        parameterId: $PARAMETER$
        locationId: {{ grid_locationid }}
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          id: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: Station_parameter
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: $PARAMETER$
        locationSetId: $STATIONLOCATIONS$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          id: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    transformation:
    - id: station_parameter_transformation
      body:
        interpolationSpatial:
          closestDistance:
            inputVariable:
              variableId: Gridded_parameter
            distanceGeoDatum: $DISTANCEGEODATUM$
            overrulingXAttribute: LonCorrection
            overrulingYAttribute: LatCorrection
            outputVariable:
              variableId: Station_parameter
contributions: []
