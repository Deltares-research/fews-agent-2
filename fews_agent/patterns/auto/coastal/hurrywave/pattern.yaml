name: hurrywave
description: >-
  Run a HurryWave fast spectral wave model as a hindcast (HC) / forecast (FC)
  pair through the FEWS general adapter. Farmed from the FEWS-Caribbean config
  (Config/ModuleConfigFiles/Hurrywave/HurrywaveHindcastTemplate.xml +
  HurrywaveForecastTemplate.xml + IdMapFiles/Hurrywave/IdMapTo|FromHurrywave.xml).
  Same generalAdapterRun shape as coastal_sfincs but wind-only forcing (one
  amuamv NetCDF, no pressure) and wave outputs (Hs / peak direction / peak
  period as grid + station scalar). HC captures a dated .rst restart; FC
  warm-starts from the HC state, both falling back to <domain>HurrywaveHindcast.
  Folder/executable placeholders ($ModulesFolder$, $HurrywaveExecutable$,
  $DumpFilesFolder$, $MODULE_INSTANCE_ID$) stay literal.
keywords: [hurrywave, spectral wave, wave model, wave forecast]
variables:
  domain:
    type: str
    required: false
    default: NorthAtlantic
  meteo:
    type: str
    required: false
    default: Ecmwf
  module_instance_meteo:
    type: str
    required: false
    default: ImportEcmwfMeteo
  location_id_meteo:
    type: str
    required: false
    default: Ecmwf
  # Parent domain to nest in. When set, this instance ALSO exports the
  # parent HurryWave run's boundary wave spectrum (hurrywave.bsp) at this
  # domain's HurrywaveBoundaryPoints as the nesting boundary. Empty = a
  # standalone / overview run (the non-nested template).
  nest_in_domain:
    type: str
    required: false
    default: ''
  # Time step of the boundary spectrum series exported from the parent.
  time_step_input_scalar_minutes:
    type: int
    required: false
    default: 10
  emit_idmap:
    type: bool
    required: false
    default: true
  time_step_meteo_hours:
    type: int
    required: false
    default: 3
  view_period_start_hours:
    type: int
    required: false
    default: -48
  view_period_end_hours:
    type: int
    required: false
    default: 48
  time_step_grid_minutes:
    type: int
    required: false
    default: 60
  time_step_scalar_minutes:
    type: int
    required: false
    default: 10
  expiry_state_days:
    type: int
    required: false
    default: 5
  expiry_grid_historical_days:
    type: int
    required: false
    default: 5
  expiry_grid_forecasting_days:
    type: int
    required: false
    default: 5
  expiry_scalar_historical_days:
    type: int
    required: false
    default: 10
  expiry_scalar_forecasting_days:
    type: int
    required: false
    default: 10
  # Wave quantities imported from the map (grid) + his (scalar) files.
  output_parameters:
    type: list
    required: false
    default:
      - WaveHeightSignificant
      - WaveDirectionPeak
      - WavePeriodPeak
outputs:
{% for mode in ['Hindcast', 'Forecast'] %}
{% set hist = (mode == 'Hindcast') %}
- schema: GeneralAdapterRun
  output: ModuleConfigFiles/Hurrywave/Hurrywave{{ domain }}{{ mode }}.xml
  data:
    general:
      description: HurryWave {{ domain }} {{ mode }}
      piVersion: '1.8'
      rootDir: $ModulesFolder$/Hurrywave/{{ domain }}/{{ mode }}
      workDir: '%ROOT_DIR%'
      exportDir: '%WORK_DIR%'
      exportDataSetDir: '%WORK_DIR%'
      exportIdMap: IdMapToHurrywave
      exportUnitConversionsId: ExportUnitConversions
      importDir: '%WORK_DIR%'
      importIdMap: IdMapFromHurrywave
      dumpFileDir: $DumpFilesFolder$
      dumpDir: '%WORK_DIR%'
      diagnosticFile: '%WORK_DIR%/hurrywave.log'
      missVal: '-99'
      timeZone:
        timeZoneName: GMT+0:00
      startDateTimeFormat: yyyyMMdd HHmmss
      endDateTimeFormat: yyyyMMdd HHmmss
    activities:
      startUpActivities:
        purgeActivity:
        - includeSubdirectories: true
          filter: '%WORK_DIR%/*.*'
      exportActivities:
        exportStateActivity:
        - moduleInstanceId: {{ domain }}Hurrywave{{ meteo }}Hindcast
          stateExportDir: .
          stateSelection:
            warmState:
              stateSearchPeriod:
                unit: hour
{% if hist %}
                start: {{ view_period_start_hours }}
                end: -1
{% else %}
                start: -1
                end: 0
{% endif %}
            overrulingColdStateModuleInstanceId: {{ domain }}HurrywaveHindcast
        exportDataSetActivity:
        - moduleInstanceId: {{ domain }}Hurrywave
        exportNetcdfActivity:
        - exportFile: hurrywave_amuamv_input.nc
          netcdfFormat: netcdf3
          timeSeriesSets:
            timeSeriesSet:
{% for wind in ['WindSpeedU', 'WindSpeedV'] %}
            - moduleInstanceId: {{ module_instance_meteo }}
              valueType: grid
              parameterId: {{ wind }}
              locationId: {{ location_id_meteo }}
              timeSeriesType: external historical
              timeStep:
                unit: hour
                multiplier: {{ time_step_meteo_hours }}
              relativeViewPeriod:
                unit: hour
                start: {{ view_period_start_hours }}
                end: {{ view_period_end_hours }}
              readWriteMode: read only
{% endfor %}
{% if nest_in_domain %}
        - exportFile: hurrywave.bsp
          netcdfFormat: netcdf3
          timeSeriesSets:
            timeSeriesSet:
            - moduleInstanceId: {{ nest_in_domain }}Hurrywave{{ meteo }}Hindcast
              valueType: scalar
              parameterId: WaveSpectrum
              domainParameterId:
              - Frequency
              - Direction
              locationSetId: HurrywaveBoundaryPoints{{ domain }}
              timeSeriesType: {{ 'simulated historical' if hist else 'simulated forecasting' }}
              timeStep:
                unit: minute
                multiplier: {{ time_step_input_scalar_minutes }}
              relativeViewPeriod:
                unit: hour
                start: {{ view_period_start_hours }}
                end: {{ view_period_end_hours }}
              readWriteMode: read only
{% endif %}
        exportCustomFormatRunFileActivity:
        - templateFile: '%WORK_DIR%/hurrywave_template.inp'
          exportFile: '%WORK_DIR%/hurrywave.inp'
      executeActivities:
        executeActivity:
        - description: Run HurryWave {{ domain }}
          command:
            executable: $HurrywaveExecutable$
          logFile:
          - file: '%WORK_DIR%/hurrywave.log'
            errorLinePattern: '*Simulation stopped*'
            infoLinePattern: '*'
          timeOut: 9000000
          ignoreDiagnostics: true
      importActivities:
{% if hist %}
        importStateActivity:
        - stateImportDir: '%WORK_DIR%'
          stateFileDateTimePattern: "'hurrywave.'yyyyMMdd'.'HHmmss'.rst'"
          relativeExportFile: hurrywave.rst
          compressedStateLocation: directory
          expiryTime:
            unit: day
            multiplier: {{ expiry_state_days }}
{% endif %}
        importNetcdfActivity:
        - importFile: '%WORK_DIR%/hurrywave_map.nc'
          timeSeriesSets:
            timeSeriesSet:
{% for gp in output_parameters %}
            - moduleInstanceId: $MODULE_INSTANCE_ID$
              valueType: grid
              parameterId: {{ gp }}
              locationId: {{ domain }}Hurrywave
              timeSeriesType: {{ 'simulated historical' if hist else 'simulated forecasting' }}
              timeStep:
                unit: minute
                multiplier: {{ time_step_grid_minutes }}
              readWriteMode: add originals
              expiryTime:
                unit: day
                multiplier: {{ expiry_grid_historical_days if hist else expiry_grid_forecasting_days }}
{% endfor %}
        - importFile: '%WORK_DIR%/hurrywave_his.nc'
          timeSeriesSets:
            timeSeriesSet:
{% for sp in output_parameters %}
            - moduleInstanceId: $MODULE_INSTANCE_ID$
              valueType: scalar
              parameterId: {{ sp }}
              locationSetId: StationsHurrywave{{ domain }}
              timeSeriesType: {{ 'simulated historical' if hist else 'simulated forecasting' }}
              timeStep:
                unit: minute
                multiplier: {{ time_step_scalar_minutes }}
              readWriteMode: add originals
              expiryTime:
                unit: day
                multiplier: {{ expiry_scalar_historical_days if hist else expiry_scalar_forecasting_days }}
{% endfor %}
- schema: Workflow
  output: WorkflowFiles/Hurrywave/Hurrywave{{ domain }}{{ mode }}.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: false
      moduleInstanceId: {{ domain }}Hurrywave{{ mode }}
{% endfor %}
{% if emit_idmap %}
- schema: IdMap
  output: IdMapFiles/Hurrywave/IdMapToHurrywave.xml
  data:
    version: '1.1'
    parameter:
    - internal: Direction
      external: theta
    - internal: Frequency
      external: sigma
    - internal: WaveSpectrum
      external: point_spectrum2d
    - internal: WindSpeedU
      external: eastward_wind
    - internal: WindSpeedV
      external: northward_wind
    enableOneToOneMapping: true
- schema: IdMap
  output: IdMapFiles/Hurrywave/IdMapFromHurrywave.xml
  data:
    version: '1.1'
    parameter:
    - internal: Direction
      external: theta
    - internal: Frequency
      external: sigma
    - internal: WaveDirectionPeak
      external: point_wavdir
    - internal: WaveDirectionPeak
      external: wavdir
    - internal: WaveDirectionalSpread
      external: dirspr
    - internal: WaveDirectionalSpread
      external: point_dirspr
    - internal: WaveHeightSignificant
      external: point_hm0
    - internal: WaveHeightSignificant
      external: hm0
    - internal: WavePeriodPeak
      external: point_tp
    - internal: WavePeriodPeak
      external: tp
    - internal: WaveSpectrum
      external: point_spectrum2d
    location:
    - internal: {{ domain }}Hurrywave
      external: {{ domain }}Hurrywave
    locationIdFunction:
    - internalLocationSet: StationsHurrywaveAll
      externalLocationFunction: '@HurrywaveId@'
    enableOneToOneMapping: true
{% endif %}
contributions: []
