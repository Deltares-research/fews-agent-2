name: wes_post_adapter
description: >-
  Run the WES (Wind Enhance Scheme) post-adapter to build parametric cyclone
  wind fields (spiderweb) from a processed track (generalAdapterRun). Farmed
  from the FEWS-Caribbean config (Config/ModuleConfigFiles/Import/
  WesPostAdapterTemplate.xml). Exports a NetCDF run file tuning the adapter
  (cyclone radius, wind conversion, ...), runs nl.deltares.wes.post.WesPostAdapter,
  then imports the resulting wes_grid_*.nc as WindSpeedMaximum + WindDirection
  grids into the Process<TrackSource> instance. Folder placeholders stay literal.
keywords: [wes, wind enhance scheme, parametric wind, cyclone wind field]
variables:
  name:
    type: str
    required: false
    default: WesPostAdapter
  track_source:
    type: str
    required: false
    default: Jtwc
  spiderweb_location_id:
    type: str
    required: false
    default: Models.Spiderweb
  expiry_days:
    type: int
    required: false
    default: 5
  radius_of_cyclone_m:
    type: str
    required: false
    default: '800000.0'
  wind_conversion_factor:
    type: str
    required: false
    default: '0.93'
outputs:
- schema: GeneralAdapterRun
  output: ModuleConfigFiles/Import/{{ name }}.xml
  data:
    general:
      piVersion: '1.8'
      rootDir: $ModulesFolder$/DownloadProcessCycloneTracks
      workDir: '%ROOT_DIR%'
      exportDir: '%ROOT_DIR%'
      exportDataSetDir: '%ROOT_DIR%'
      importDir: '%ROOT_DIR%'
      importIdMap: IdMapFromWes
      dumpFileDir: $DumpFilesFolder$
      dumpDir: '%ROOT_DIR%'
      diagnosticFile: '%ROOT_DIR%/ToFews/fews_ga_logfile.xml'
      dateTimeFormat:
      - id: dateFormat
        dateTimePattern: yyyyMMdd
    activities:
      exportActivities:
        exportNetcdfRunFileActivity:
        - description: This run file is passed as argument to WesPostAdapter
          exportFile: RunWesPostAdapter.nc
          properties:
            string:
            - key: IGNORE_TIME_SERIES_FROM_DIA_FILE
              value: 'true'
            - key: MODIFY_LONGITUDE
              value: 'true'
            double:
            - key: NODATA_VALUE
              value: '-999'
            - key: RADIUS_OF_CYCLONE
              value: '{{ radius_of_cyclone_m }}'
            - key: WES_THRESHOLD_SPEED
              value: '0'
            - key: WIND_CONV_FAC
              value: '{{ wind_conversion_factor }}'
      executeActivities:
        executeActivity:
        - command:
            className: nl.deltares.wes.post.WesPostAdapter
            binDir: $BinariesFolder$/BinWesAdapter
          arguments:
            argument:
            - '%WORK_DIR%/RunWesPostAdapter.nc'
          timeOut: 1200000
          ignoreDiagnostics: true
      importActivities:
        importNetcdfActivity:
        - folder: '%WORK_DIR%'
          fileNamePatternFilter: 'wes_grid_*.nc'
          timeSeriesSets:
            timeSeriesSet:
{% for p in ['WindSpeedMaximum', 'WindDirection'] %}
            - moduleInstanceId: Process{{ track_source }}
              valueType: grid
              parameterId: {{ p }}
              locationId: {{ spiderweb_location_id }}
              timeSeriesType: simulated forecasting
              timeStep:
                unit: nonequidistant
              readWriteMode: add originals
              expiryTime:
                unit: day
                multiplier: {{ expiry_days }}
{% endfor %}
- schema: Workflow
  output: WorkflowFiles/Import/{{ name }}.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: true
      moduleInstanceId: '{{ name }}'
contributions: []
