name: earth2observe
description: 'Auto-derived pattern from tutorial instances: E2O.'
variables:
  source_name:
    type: str
    required: true
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/Earth2Observe/Import{{ source_name }}.xml
  data:
    import:
    - general:
        importType: NETCDF-CF_GRID
        serverUrl: https://wci.earth2observe.eu/thredds/dodsC/ecmwf/met_forcing_v1/tair_daily.nc
        relativeViewPeriod:
          unit: day
          start: $STARTTIME$
          end: $ENDTIME$
          startOverrulable: true
        idMapId: IdImportE2O
        unitConversionsId: ImportUnitConversions
        dataFeedId: E2O.Server.Temperature
        expiryTime:
          unit: day
          multiplier: 365
      timeSeriesSet:
      - moduleInstanceId: ImportE2O
        valueType: grid
        parameterId: TA.obs
        locationId: E2O_25
        timeSeriesType: external historical
        timeStep:
          id: $DAY_TIMESTEP$
        readWriteMode: add originals
      externUnit:
      - parameterId: TA.obs
        unit: K
    - general:
        importType: NETCDF-CF_GRID
        serverUrl: https://wci.earth2observe.eu/thredds/dodsC/deltares/PET/wrr2/0.25degree/penmanmonteith-agg.nc
        relativeViewPeriod:
          unit: day
          start: $STARTTIME$
          end: $ENDTIME$
          startOverrulable: true
        idMapId: IdImportE2O
        unitConversionsId: ImportUnitConversions
        dataFeedId: E2O.Server.Evaporation
        expiryTime:
          unit: day
          multiplier: 365
      timeSeriesSet:
      - moduleInstanceId: ImportE2O
        valueType: grid
        parameterId: PET.obs
        locationId: E2O_25
        timeSeriesType: external historical
        timeStep:
          id: $DAY_TIMESTEP$
        readWriteMode: add originals
    - general:
        importType: NETCDF-CF_GRID
        serverUrl: https://wci.earth2observe.eu/thredds/dodsC/jrc/mswep-rainf-daily-agg.nc
        relativeViewPeriod:
          unit: day
          start: $STARTTIME$
          end: $ENDTIME$
          startOverrulable: true
        idMapId: IdImportE2O
        unitConversionsId: ImportUnitConversions
        dataFeedId: E2O.Server.Rainfall
        expiryTime:
          unit: day
          multiplier: 365
      timeSeriesSet:
      - moduleInstanceId: ImportE2O
        valueType: grid
        parameterId: PC.obs
        qualifierId: rainonly
        locationId: E2O_25
        timeSeriesType: external historical
        timeStep:
          id: $DAY_TIMESTEP$
        readWriteMode: add originals
      externUnit:
      - parameterId: PC.obs
        unit: kg_m2s
    - general:
        importType: NETCDF-CF_GRID
        serverUrl: https://wci.earth2observe.eu/thredds/dodsC/jrc/mswep-snowf-daily-agg.nc
        relativeViewPeriod:
          unit: day
          start: $STARTTIME$
          end: $ENDTIME$
          startOverrulable: true
        idMapId: IdImportE2O
        unitConversionsId: ImportUnitConversions
        dataFeedId: E2O.Server.Snowfall
        expiryTime:
          unit: day
          multiplier: 365
      timeSeriesSet:
      - moduleInstanceId: ImportE2O
        valueType: grid
        parameterId: PC.obs
        qualifierId: snowonly
        locationId: E2O_25
        timeSeriesType: external historical
        timeStep:
          id: $DAY_TIMESTEP$
        readWriteMode: add originals
      externUnit:
      - parameterId: PC.obs
        unit: kg_m2s
- schema: Workflow
  output: WorkflowFiles/Import/Earth2Observe/Import{{ source_name }}Grids.xml
  data:
    version: '1.1'
    properties:
      string:
      - key: INPUTGRID
        value: E2O_25
      - key: INPUTMODULEINSTANCE
        value: ImportE2O
      - key: STARTTIME
        value: '-365'
      - key: ENDTIME
        value: '0'
      - key: TIMESERIESTYPE
        value: external historical
      - key: TIMESTEP
        value: '24'
      - key: ENSEMBLE
        value: main
    activity:
    - runIndependent: false
      moduleInstanceId: ImportE2O
    - runIndependent: false
      moduleInstanceId: MergeE2OPrecip
    - runIndependent: false
      workflowId: PreprocessE2O$MODELNAME1$
    - runIndependent: false
      workflowId: PreprocessE2O$MODELNAME2$
contributions: []
