name: satellite_precip_GSMAP
description: 'Auto-derived pattern from tutorial instances: GSMAP.'
variables:
  source_name:
    type: str
    required: true
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/EarthObservation/Import{{ source_name }}.xml
  data:
    import:
    - general:
        importType: GSMAP
        folder: $IMPORT_FOLDER$/GSMAP
        fileNameObservationDateTimePattern: '''gsmap_nrt.''yyyyMMdd''.''HHmm''.dat'''
        failedFolder: $IMPORT_FAILED_FOLDER$/GSMAP
        backupFolder: $IMPORT_BACKUP_FOLDER$/GSMAP
        idMapId: IdImportGSMAP
        unitConversionsId: ImportUnitConversions
        importTimeZone:
          timeZoneOffset: +00:00
        dataFeedId: GSMAP.Precipitation
      timeSeriesSet:
      - moduleInstanceId: ImportGSMAP
        valueType: grid
        parameterId: PC.obs
        locationId: GSMAP_world
        timeSeriesType: external historical
        timeStep:
          unit: hour
        readWriteMode: add originals
      externUnit:
      - parameterId: PC.obs
        unit: mm
    - general:
        importType: GSMAP
        folder: ftp://rainmap:Niskur+1404@hokusai.eorc.jaxa.jp/realtime/archive/
        fileNameDateTimeFilter:
        - subFolderLevel: 1
          timeStep:
            unit: year
          dateTimePattern: yyyy
          preFixLength: 0
          postFixLength: 0
        - subFolderLevel: 2
          timeStep:
            unit: month
          dateTimePattern: MM
          preFixLength: 0
          postFixLength: 0
        - subFolderLevel: 3
          timeStep:
            unit: day
          dateTimePattern: dd
          preFixLength: 0
          postFixLength: 0
        fileNameObservationDateTimePattern: '''gsmap_nrt.''yyyyMMdd''.''HHmm''.dat.gz'''
        failedFolder: $IMPORT_FAILED_FOLDER$
        backupFolder: $IMPORT_BACKUP_FOLDER$
        relativeViewPeriod:
          unit: hour
          start: -12
          end: 0
          startOverrulable: true
          endOverrulable: false
        idMapId: IdImportGSMAP
        unitConversionsId: ImportUnitConversions
        importTimeZone:
          timeZoneOffset: +00:00
        dataFeedId: GSMAP.Server.Precipitation
      timeSeriesSet:
      - moduleInstanceId: ImportGSMAP
        valueType: grid
        parameterId: PC.obs
        locationId: GSMAP_world
        timeSeriesType: external historical
        timeStep:
          unit: hour
        readWriteMode: add originals
      externUnit:
      - parameterId: PC.obs
        unit: mm
contributions: []
