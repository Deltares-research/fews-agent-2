name: tpl_astronomical_tide
description: >-
  Generate astronomical tide water levels at stations from tidal constituents
  (transformationModule / generation / tidalConstituents). Farmed from the
  FEWS-Caribbean config (Config/ModuleConfigFiles/AstronomicalTide/
  AstronomicalTideTemplate.xml). The constituent amplitude/phase come from a
  coefficientSet (the @Tidal*@ references resolve at runtime), so the tide is
  reconstructed per station over the view period.
variables:
  name:
    type: str
    required: false
    default: AstronomicalTide
  station_locationset_id:
    type: str
    required: false
    default: StationsAstronomicalTide
  time_series_type:
    type: str
    required: false
    default: external historical
  time_step_minutes:
    type: int
    required: false
    default: 10
  view_period_start_hours:
    type: int
    required: false
    default: -48
  view_period_end_hours:
    type: int
    required: false
    default: 48
  expiry_days:
    type: int
    required: false
    default: 365
outputs:
- schema: TransformationModule
  output: ModuleConfigFiles/AstronomicalTide/{{ name }}.xml
  data:
    version: '1.0'
    variable:
    - variableId: WaterLevelAstronomical
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: WaterLevelAstronomical
        locationSetId: {{ station_locationset_id }}
        timeSeriesType: {{ time_series_type }}
        timeStep:
          unit: minute
          multiplier: {{ time_step_minutes }}
        relativeViewPeriod:
          unit: hour
          start: {{ view_period_start_hours }}
          end: {{ view_period_end_hours }}
        readWriteMode: add originals
        expiryTime:
          unit: day
          multiplier: {{ expiry_days }}
    transformation:
    - id: WaterLevelAstronomical
      body:
        generation:
          tidalConstituents:
            coefficientSetFunctions:
              constituent:
                '@name': '@TidalConstituent@'
                '@amplitude': '@TidalAmplitude@'
                '@phase': '@TidalPhase@'
            outputVariable:
              variableId: WaterLevelAstronomical
contributions: []
