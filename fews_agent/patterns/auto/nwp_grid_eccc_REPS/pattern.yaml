name: nwp_grid_eccc_REPS
description: 'Auto-derived pattern from tutorial instances: REPS.'
variables:
  nwp_name:
    type: str
    required: true
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/ECCCGrids/Import{{ nwp_name }}.xml
  data:
    import:
    - general:
        importType: CanadaMeteoWCS
        serverUrl: https://geo.weather.gc.ca/geomet?SERVICE=WCS&VERSION=2.0.1&REQUEST=GetCoverage
        relativeViewPeriod:
          unit: hour
          start: 3
          end: 60
          startOverrulable: true
          endOverrulable: true
        idMapId: IdImportCanadaWCS
      startTimeShift:
        parameterId: PC.nwp
        relativePeriod:
          unit: hour
          start: -3
          end: 0
      properties:
        string:
        - key: subsettingCrs
          value: EPSG:4326
      timeSeriesSet:
      - moduleInstanceId: ImportREPS
        valueType: grid
        parameterId: PC.nwp
        locationId: REPS
        timeSeriesType: external forecasting
        timeStep:
          unit: hour
          multiplier: 3
        readWriteMode: add originals
        ensembleId: REPS
      externUnit:
      - parameterId: PC.nwp
        unit: kg m-2
        cumulativeSum: true
    - general:
        importType: CanadaMeteoWCS
        serverUrl: https://geo.weather.gc.ca/geomet?SERVICE=WCS&VERSION=2.0.1&REQUEST=GetCoverage
        relativeViewPeriod:
          unit: hour
          start: 0
          end: 60
          startOverrulable: true
          endOverrulable: true
        idMapId: IdImportCanadaWCS
      properties:
        string:
        - key: subsettingCrs
          value: EPSG:4326
      timeSeriesSet:
      - moduleInstanceId: ImportREPS
        valueType: grid
        parameterId: TA.nwp
        locationId: REPS
        timeSeriesType: external forecasting
        timeStep:
          unit: hour
          multiplier: 3
        readWriteMode: add originals
        ensembleId: REPS
      externUnit:
      - parameterId: TA.nwp
        unit: K
- schema: Workflow
  output: WorkflowFiles/Import/ECCCGrids/Import{{ nwp_name }}Grids.xml
  data:
    version: '1.1'
    properties:
      string:
      - key: FORECAST
        value: REPS
      - key: TIMESTEP
        value: '3'
      - key: EXPIRYTIME
        value: '7'
      - key: INPUTGRID
        value: REPS
      - key: OUTPUTGRID
        value: $MODELNAME1$Grid
      - key: INPUTMODULEINSTANCE
        value: ImportREPS
      - key: ENSEMBLE
        value: REPS
      - key: BASINLOCATIONS
        value: $MODELNAME1$Basins
      - key: STATIONLOCATIONS
        value: ECCCStations$REGION$
      - key: TIMESERIESTYPE
        value: external forecasting
    activity:
    - runIndependent: true
      moduleInstanceId: ImportREPS
      ensemble:
        ensembleId: REPS
        ensembleMemberIndexRange:
          start: 0
          end: 20
        runInLoop: false
    - workflowId: PreprocessREPS$MODELNAME1$
    - workflowId: PreprocessREPS$MODELNAME2$
contributions: []
