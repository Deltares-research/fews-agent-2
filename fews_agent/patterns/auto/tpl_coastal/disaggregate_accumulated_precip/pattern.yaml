name: tpl_disaggregate_accumulated_precip
description: >-
  Disaggregate an accumulated series (e.g. precipitation) onto a finer time
  step (transformationModule, disaggregation/accumulative). Farmed from the
  FEWS-Caribbean config (Config/ModuleConfigFiles/Import/
  ProcessPrecipitationTemplate.xml).
variables:
  name:
    type: str
    required: false
    default: ProcessPrecipitation
  input_instance:
    type: str
    required: false
    default: ImportEcmwfMeteo
  parameter_id:
    type: str
    required: false
    default: Precipitation
  locationset_id:
    type: str
    required: false
    default: StationsEcmwfMeteo
  time_series_type:
    type: str
    required: false
    default: external forecasting
  time_step_input_hours:
    type: int
    required: false
    default: 6
  time_step_output_hours:
    type: int
    required: false
    default: 3
  view_period_start_hours:
    type: int
    required: false
    default: -48
  view_period_end_hours:
    type: int
    required: false
    default: 48
  expiry_days:
    type: int
    required: false
    default: 5
outputs:
- schema: TransformationModule
  output: ModuleConfigFiles/Import/{{ name }}.xml
  data:
    version: '1.0'
    variable:
    - variableId: Input
      timeSeriesSet:
        moduleInstanceId: {{ input_instance }}
        valueType: scalar
        parameterId: {{ parameter_id }}
        locationSetId: {{ locationset_id }}
        timeSeriesType: {{ time_series_type }}
        timeStep:
          unit: hour
          multiplier: {{ time_step_input_hours }}
        relativeViewPeriod:
          unit: hour
          start: {{ view_period_start_hours }}
          end: {{ view_period_end_hours }}
          endOverrulable: false
        readWriteMode: read only
    - variableId: InputDisaggregated
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: {{ parameter_id }}
        locationSetId: {{ locationset_id }}
        timeSeriesType: {{ time_series_type }}
        timeStep:
          unit: hour
          multiplier: {{ time_step_output_hours }}
        relativeViewPeriod:
          unit: hour
          start: {{ view_period_start_hours }}
          end: {{ view_period_end_hours }}
          endOverrulable: false
        readWriteMode: add originals
        expiryTime:
          unit: day
          multiplier: {{ expiry_days }}
    transformation:
    - id: InputDisaggregated
      body:
        disaggregation:
          accumulative:
            inputVariable:
              variableId: Input
            outputVariable:
              variableId: InputDisaggregated
contributions: []
