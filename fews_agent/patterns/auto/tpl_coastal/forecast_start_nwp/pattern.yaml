name: tpl_forecast_start_nwp
description: >-
  Set the forecast T0 to the earliest time of an external NWP forecast
  (forecastLengthEstimator). Farmed from the FEWS-Caribbean config
  (Config/ModuleConfigFiles/Import/ForecastStartNwpTemplate.xml). Reads a
  meteo forecast grid and pins T0 to its earliest available forecast time so
  downstream model runs align to the freshest NWP cycle.
variables:
  name:
    type: str
    required: false
    default: ForecastStartNwp
  meteo_forecast_instance:
    type: str
    required: false
    default: ImportEcmwfMeteo
  parameter_id:
    type: str
    required: false
    default: AirPressureMeanSeaLevel
  location_id_meteo:
    type: str
    required: false
    default: Ecmwf
  time_step_meteo_hours:
    type: int
    required: false
    default: 3
outputs:
- schema: ForecastLengthEstimator
  output: ModuleConfigFiles/Import/{{ name }}.xml
  data:
    externalForecastTimeSeries:
    - moduleInstanceId: {{ meteo_forecast_instance }}
      valueType: grid
      parameterId: {{ parameter_id }}
      locationId: {{ location_id_meteo }}
      timeSeriesType: external forecasting
      timeStep:
        unit: hour
        multiplier: {{ time_step_meteo_hours }}
      readWriteMode: read complete forecast
    setTime0ToEarliestExternalForecastTime: true
contributions: []
