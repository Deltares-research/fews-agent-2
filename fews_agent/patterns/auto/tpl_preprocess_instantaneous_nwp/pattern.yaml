name: tpl_preprocess_instantaneous_nwp
description: 'Auto-derived pattern from tutorial instances: PreprocessInstantaneousParametersNWPTemplate.'
variables:
  template_name:
    type: str
    required: true
outputs:
- schema: TransformationModule
  output: ModuleConfigFiles/Preprocess/GriddedData/{{ template_name }}.xml
  data:
    version: '1.0'
    variable:
    - variableId: Gridded_parameter
      timeSeriesSet:
        moduleInstanceId: $INPUTMODULEINSTANCE$
        valueType: grid
        parameterId: $PARAMETER$
        locationId: $INPUTGRID$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: Gridded_parameter_clipped
      timeSeriesSet:
        moduleInstanceId: $INPUTMODULEINSTANCE$
        valueType: grid
        parameterId: $PARAMETER$
        locationId: $OUTPUTGRID$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: Gridded_parameter_clipped_daily
      timeSeriesSet:
        moduleInstanceId: $INPUTMODULEINSTANCE$
        valueType: grid
        parameterId: $PARAMETER$
        locationId: $OUTPUTGRID$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: day
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: Basin_parameter
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: $PARAMETER$
        locationSetId: $BASINLOCATIONS$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    - variableId: Station_parameter
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: $PARAMETER$
        locationSetId: $STATIONLOCATIONS$
        timeSeriesType: $TIMESERIESTYPE$
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        readWriteMode: read complete forecast
        ensembleId: $ENSEMBLE$
    transformation:
    - id: clip_parameter
      body:
        interpolationSpatial:
          closestDistance:
            inputVariable:
              variableId: Gridded_parameter
            distanceGeoDatum: $DISTANCEGEODATUM$
            outputVariable:
              variableId: Gridded_parameter_clipped
    - id: grid_parameter_daily
      body:
        aggregation:
          instantaneous:
            inputVariable:
              variableId: Gridded_parameter_clipped
            outputVariable:
              variableId: Gridded_parameter_clipped_daily
    - id: basin_parameter
      body:
        interpolationSpatial:
          average:
            inputVariable:
              variableId: Gridded_parameter
            outputVariable:
              variableId: Basin_parameter
    - id: station_parameter
      body:
        interpolationSpatial:
          closestDistance:
            inputVariable:
              variableId: Gridded_parameter
            distanceGeoDatum: $DISTANCEGEODATUM$
            outputVariable:
              variableId: Station_parameter
contributions: []
