name: snow_import_SNODAS
description: 'Auto-derived pattern from tutorial instances: SNODAS.'
variables:
  snow_source:
    type: str
    required: true
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/Snow/Import{{ snow_source }}.xml
  data:
    import:
    - general:
        importType: grib2
        folder: $IMPORT_FOLDER$/SNODAS
        fileNamePatternFilter: zz_ssmv11034tS__T0001TTNATS*05HP001.grib2
        failedFolder: $IMPORT_FAILED_FOLDER$/SNODAS
        backupFolder: $IMPORT_BACKUP_FOLDER$/SNODAS
        relativeViewPeriod:
          unit: day
          start: -3
          end: 0
          startOverrulable: false
          endOverrulable: false
        idMapId: IdImportSNODAS
        unitConversionsId: ImportUnitConversions
        missingValue: '-99999.0'
        importTimeZone:
          timeZoneName: GMT+0
        dataFeedId: SNODAS
      timeSeriesSet:
      - moduleInstanceId: ImportSNODAS
        valueType: grid
        parameterId: SWE.sim
        locationId: SNODAS
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: 6
        readWriteMode: add originals
        synchLevel: 6
        expiryTime:
          unit: day
          multiplier: 15
      externUnit:
      - parameterId: SWE.sim
        unit: kg.m-2
    - general:
        importType: grib2
        folder: $IMPORT_FOLDER$/SNODAS
        fileNamePatternFilter: zz_ssmv11038wS__A0006TTNATS*05HP001.grib2
        failedFolder: $IMPORT_FAILED_FOLDER$/SNODAS
        backupFolder: $IMPORT_BACKUP_FOLDER$/SNODAS
        relativeViewPeriod:
          unit: day
          start: -3
          end: 0
          startOverrulable: false
          endOverrulable: false
        idMapId: IdImportSNODAS
        unitConversionsId: ImportUnitConversions
        missingValue: '-99999.0'
        importTimeZone:
          timeZoneName: GMT+0
        dataFeedId: SNODAS
      timeSeriesSet:
      - moduleInstanceId: ImportSNODAS
        valueType: grid
        parameterId: SE.sim
        locationId: SNODAS
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: 6
        readWriteMode: add originals
        synchLevel: 6
        expiryTime:
          unit: day
          multiplier: 15
      externUnit:
      - parameterId: SE.sim
        unit: K
    - general:
        importType: grib2
        folder: $IMPORT_FOLDER$/SNODAS
        fileNamePatternFilter: zz_ssmv11044bS__T0006TTNATS*05HP000.grib2
        failedFolder: $IMPORT_FAILED_FOLDER$/SNODAS
        backupFolder: $IMPORT_BACKUP_FOLDER$/SNODAS
        relativeViewPeriod:
          unit: day
          start: -3
          end: 0
          startOverrulable: false
          endOverrulable: false
        idMapId: IdImportSNODAS
        unitConversionsId: ImportUnitConversions
        missingValue: '-99999.0'
        importTimeZone:
          timeZoneName: GMT+0
        dataFeedId: SNODAS
      timeSeriesSet:
      - moduleInstanceId: ImportSNODAS
        valueType: grid
        parameterId: SM.sim
        locationId: SNODAS
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: 6
        readWriteMode: add originals
        synchLevel: 6
        expiryTime:
          unit: day
          multiplier: 15
      externUnit:
      - parameterId: SM.sim
        unit: kg.m-2
- schema: GeneralAdapterRun
  output: ModuleConfigFiles/Import/Snow/Retrieve{{ snow_source }}.xml
  data:
    general:
      piVersion: '1.10'
      rootDir: '%REGION_HOME%/Modules'
      workDir: '%ROOT_DIR%/SnowDownload'
      exportDir: '%ROOT_DIR%/SnowDownload'
      exportDataSetDir: '%ROOT_DIR%'
      importDir: '%ROOT_DIR%/SnowDownload'
      dumpFileDir: $GA_DUMPFILEDIR$
      dumpDir: '%ROOT_DIR%/SnowDownload'
      diagnosticFile: '%ROOT_DIR%/SnowDownload/diag.xml'
      time0Format: yyyyMMdd
    activities:
      startUpActivities:
        purgeActivity:
        - filter: '%ROOT_DIR%/SnowDownload/*.*'
      exportActivities:
        exportDataSetActivity:
        - moduleInstanceId: SnowDownload
      executeActivities:
        executeActivity:
        - description: Run wget64.exe to download SNODAS SWE analysis
          command:
            executable: SnowDownload/DownloadSNODAS.bat
          arguments:
            argument:
            - https://www.nohrsc.noaa.gov/products/collaborators/
            - $IMPORT_FOLDER$/SNODAS/
            - '%TIME0%'
            - SNODAS
          timeOut: 7200000
          ignoreDiagnostics: false
- schema: Workflow
  output: WorkflowFiles/Import/Snow/Import{{ snow_source }}Grids.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: true
      moduleInstanceId: RetrieveSNODAS
    - runIndependent: true
      moduleInstanceId: ImportSNODAS
contributions: []
