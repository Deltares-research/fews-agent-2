name: tpl_modify_historic_grids
description: 'Auto-derived pattern from tutorial instances: ModifyHistoricGridsTemplate.'
variables:
  template_name:
    type: str
    required: true
outputs:
- schema: TransformationModule
  output: ModuleConfigFiles/Preprocess/ModifyData/{{ template_name }}.xml
  data:
    version: '1.0'
    variable:
    - variableId: Historic_PC
      timeSeriesSet:
        moduleInstanceId: $HISTORICMODULEINSTANCE$
        valueType: grid
        parameterId: PC.nwp
        locationId: $MODELNAME1$Grid
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: 1
        readWriteMode: read complete forecast
    - variableId: Historic_TA
      timeSeriesSet:
        moduleInstanceId: $HISTORICMODULEINSTANCE$
        valueType: grid
        parameterId: TA.nwp
        locationId: $MODELNAME1$Grid
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: 1
        readWriteMode: read complete forecast
    - variableId: PC_NWP_multiplier
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: PC.nwp.multiplier
        locationId: $MODELNAME1$Grid
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        relativeViewPeriod:
          unit: day
          start: $STARTTIME$
          end: $ENDTIME$
          startOverrulable: true
          endOverrulable: true
        readWriteMode: read only
    - variableId: PC_NWP_multiplier_grid
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: grid
        parameterId: PC.nwp.multiplier
        locationId: $MODELNAME1$Grid
        timeSeriesType: temporary
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        relativeViewPeriod:
          unit: day
          start: $STARTTIME$
          end: $ENDTIME$
          startOverrulable: true
          endOverrulable: true
        readWriteMode: read only
    - variableId: TA_NWP_incrementer
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: TA.nwp.incrementer
        locationId: $MODELNAME1$Grid
        timeSeriesType: external historical
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        relativeViewPeriod:
          unit: day
          start: $STARTTIME$
          end: $ENDTIME$
          startOverrulable: true
          endOverrulable: true
        readWriteMode: read only
    - variableId: TA_NWP_incrementer_grid
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: grid
        parameterId: TA.nwp.incrementer
        locationId: $MODELNAME1$Grid
        timeSeriesType: temporary
        timeStep:
          unit: hour
          multiplier: $TIMESTEP$
        relativeViewPeriod:
          unit: day
          start: $STARTTIME$
          end: $ENDTIME$
          startOverrulable: true
          endOverrulable: true
        readWriteMode: read only
    - variableId: Historic_PC_mod
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: grid
        parameterId: PC.nwp
        locationId: $MODELNAME1$Grid
        timeSeriesType: simulated historical
        timeStep:
          unit: hour
          multiplier: 1
        readWriteMode: read complete forecast
    - variableId: Historic_TA_mod
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: grid
        parameterId: TA.nwp
        locationId: $MODELNAME1$Grid
        timeSeriesType: simulated historical
        timeStep:
          unit: hour
          multiplier: 1
        readWriteMode: read complete forecast
    transformation:
    - id: PC_muliplier_NWP
      body:
        user:
          simple:
            expression: '1 '
            outputVariable:
              variableId: PC_NWP_multiplier
    - id: PC_muliplier_NWP_grid
      body:
        interpolationSpatial:
          closestDistance:
            inputVariable:
              variableId: PC_NWP_multiplier
            distanceGeoDatum: $DISTANCEGEODATUM$
            outputVariable:
              variableId: PC_NWP_multiplier_grid
    - id: PC_muliplier_NWP_applied
      body:
        user:
          simple:
            expression: 'Historic_PC * PC_NWP_multiplier_grid '
            outputVariable:
              variableId: Historic_PC_mod
    - id: TA_incrementer_NWP
      body:
        user:
          simple:
            expression: '0'
            outputVariable:
              variableId: TA_NWP_incrementer
    - id: TA_incrementer_NWP_grid
      body:
        interpolationSpatial:
          closestDistance:
            inputVariable:
              variableId: TA_NWP_incrementer
            distanceGeoDatum: $DISTANCEGEODATUM$
            outputVariable:
              variableId: TA_NWP_incrementer_grid
    - id: TA_incrementer_NWP_applied
      body:
        user:
          simple:
            expression: Historic_TA + TA_NWP_incrementer_grid
            outputVariable:
              variableId: Historic_TA_mod
contributions: []
