name: tpl_process_cyclone_track
description: >-
  Interpolate an irregular cyclone track (JTWC publishes at 6/12/24-hour steps
  depending on horizon) onto a fixed time step, per track quantity
  (transformationModule, sample/nonEquidistant/linear). Farmed from the
  FEWS-Caribbean config (Config/ModuleConfigFiles/Import/ProcessCycTemplate.xml).
  Reads the raw track scalars from the running instance ($MODULE_INSTANCE_ID$,
  kept literal) and writes the interpolated series to the process instance. This
  is the processing stage between the cyclone import and the WES spiderweb
  builder; note that in the FEWS-Caribbean config the cyclone chain feeds the
  WES adapter, NOT the SFINCS/HurryWave models directly.
variables:
  name:
    type: str
    required: false
    default: ProcessCyc
  # Instance the interpolated track is written to (WES reads Process<source>).
  process_instance:
    type: str
    required: false
    default: ProcessCyc
  track_location_id:
    type: str
    required: false
    default: TrackFews
  time_step_hours:
    type: int
    required: false
    default: 3
  expiry_days:
    type: int
    required: false
    default: 5
  # Track quantities interpolated to the fixed step.
  parameters:
    type: list
    required: false
    default:
      - AirPressureMeanSeaLevel
      - Latitude
      - Longitude
      - RadiusMaximumWind
      - WindSpeedMaximum
outputs:
- schema: TransformationModule
  output: ModuleConfigFiles/Import/{{ name }}.xml
  data:
    version: '1.0'
    variable:
{% for p in parameters %}
    - variableId: {{ p }}
      timeSeriesSet:
        moduleInstanceId: $MODULE_INSTANCE_ID$
        valueType: scalar
        parameterId: {{ p }}
        locationId: {{ track_location_id }}
        timeSeriesType: external forecasting
        timeStep:
          unit: nonequidistant
        readWriteMode: read complete forecast
{% endfor %}
{% for p in parameters %}
    - variableId: {{ p }}Interpolated
      timeSeriesSet:
        moduleInstanceId: {{ process_instance }}
        valueType: scalar
        parameterId: {{ p }}
        locationId: {{ track_location_id }}
        timeSeriesType: external forecasting
        timeStep:
          unit: hour
          multiplier: {{ time_step_hours }}
        readWriteMode: add originals
        expiryTime:
          unit: day
          multiplier: {{ expiry_days }}
{% endfor %}
    transformation:
{% for p in parameters %}
    - id: {{ p }}Interpolated
      body:
        sample:
          nonEquidistant:
            nonEquidistantInputVariable:
              variableId: {{ p }}
            interpolationType: linear
            outputVariable:
              variableId: {{ p }}Interpolated
{% endfor %}
contributions: []
