name: import_station_ghcnd
description: >-
  Import daily station observations from the NOAA NCEI GHCN-Daily web service
  (generalCSV over a per-station REST URL). Farmed from the FEWS-Caribbean
  config (Config/ModuleConfigFiles/Import/ImportGhcndTemplate.xml +
  IdMapFiles/Import/IdMapFromGhcnd.xml). One <import> block with a name-based
  CSV table (STATION + Date + one valueColumn per dataType), a per-parameter
  timeSeriesSet looped over $LOOP_LOCATION_ID$, plus the workflow and a
  locationIdFunction idMap. The REST URL pulls the trailing 28 days
  (RELATIVE_TIME_IN_SECONDS -2419200) up to TIME_ZERO.
variables:
  source_name:
    type: str
    required: false
    default: Ghcnd
  # LocationSet the observations land on (backed by the configurator's
  # station data); its @<source_name>Id@ attribute keys the external id.
  station_locationset_id:
    type: str
    required: false
    default: StationsGhcnd
  expiry_days:
    type: int
    required: false
    default: 365
  # Imported dataTypes. Each entry:
  #   id       internal FEWS parameterId
  #   external GHCN-D dataType code (CSV column header + URL dataTypes term)
  #   unit     unit GHCN-D reports the column in
  parameters:
    type: list
    required: false
    default:
      - id: WindDirectionObserved
        external: AWDR
        unit: degrees
      - id: WindSpeedObserved
        external: AWND
        unit: 1/10 m/s
      - id: PrecipitationObserved
        external: PRCP
        unit: 1/10 mm
      - id: AirTemperatureObserved
        external: TMAX
        unit: 1/10 °C
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/Import{{ source_name }}.xml
  data:
    import:
    - general:
        importType: generalCSV
        serverUrl: https://www.ncei.noaa.gov/access/services/data/v1?dataset=daily-summaries&dataTypes={{ (parameters | default([])) | map(attribute='external') | join(',') }}&stations=$LOOP_LOCATION_ID$&startDate=%RELATIVE_TIME_IN_SECONDS(yyyy-MM-dd,-2419200)%&endDate=%TIME_ZERO(yyyy-MM-dd)%&boundingBox=90,-180,-90,180
        table:
          locationColumn:
            name: STATION
          dateColumn:
          - name: Date
            pattern: yyyy-MM-dd
          valueColumn:
{% for p in parameters %}
          - name: '{{ p.external }}'
            unit: '{{ p.unit }}'
            parameterId: {{ p.id }}
{% endfor %}
        idMapId: IdMapFrom{{ source_name }}
        unitConversionsId: ImportUnitConversions
        dataFeedId: NOAA - GHCNd
        expiryTime:
          unit: day
          multiplier: {{ expiry_days }}
      timeSeriesSet:
{% for p in parameters %}
      - moduleInstanceId: Import{{ source_name }}
        valueType: scalar
        parameterId: {{ p.id }}
        locationId: $LOOP_LOCATION_ID$
        timeSeriesType: external historical
        timeStep:
          unit: day
        readWriteMode: add originals
{% endfor %}
- schema: Workflow
  output: WorkflowFiles/Import/Import{{ source_name }}.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: true
      moduleInstanceId: Import{{ source_name }}
- schema: IdMap
  output: IdMapFiles/Import/IdMapFrom{{ source_name }}.xml
  data:
    version: '1.1'
    locationIdFunction:
    - internalLocationSet: {{ station_locationset_id }}
      externalLocationFunction: '@{{ source_name }}Id@'
    enableOneToOneMapping: true
contributions: []
