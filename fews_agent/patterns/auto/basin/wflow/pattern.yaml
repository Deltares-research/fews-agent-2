- schema: Workflow
  output: WorkflowFiles/ModelRun/{{ basin_name }}/Run{{ basin_name }}Historic.xml
  data:
    version: '1.1'
    properties:
      string:
      - key: STARTTIME
        value: '-365'
      - key: ENDTIME
        value: '0'
      - key: INPUTTIMESERIES
        value: ImportE2O
      - key: PARAMETER1
        value: TA.obs
      - key: PARAMETER2
        value: PET.obs
      - key: PARAMETER3
        value: PC.obs
      - key: OUTPUTTIMESERIES
        value: $MODELNAME1$Historic
      - key: PARAMETER4
        value: QR.sim
      - key: PARAMETER5
        value: SWE.sim
      - key: PARAMETER6
        value: PC.sim
      - key: PARAMETER7
        value: TA.sim
      - key: PARAMETER8
        value: PET.sim
      - key: LOCATION
        value: $MODELNAME1$Grid
      - key: TIMESTEP
        value: $MODEL1_TIMESTEP$
      - key: TYPE1
        value: external historical
      - key: TYPE2
        value: simulated historical
    activity:
    - runIndependent: true
      moduleInstanceId: $MODELNAME1$Historic
      moduleConfigFileName: $MODELNAME1$HistoricTemplate
    - properties:
        string:
        - key: TIMESERIESTYPE
          value: simulated historical
        - key: PARAMETER
          value: QR.sim
        - key: ENSEMBLE
          value: main
        - key: STATIONLOCATIONS
          value: $MODELNAME1$HydroStations
        - key: TIMESTEP
          value: $MODEL1_TIMESTEP$
      runIndependent: true
      moduleInstanceId: $MODELNAME1$Historic
      moduleConfigFileName: PostprocessModelOutputToStationTemplate
- schema: Workflow
