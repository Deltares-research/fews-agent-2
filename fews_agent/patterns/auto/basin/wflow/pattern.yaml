      - key: TYPE1
        value: external forecasting
      - key: TYPE2
        value: simulated forecasting
      - key: OUTPUTGRID
        value: $MODELNAME1$Grid
      - key: HISTORICMODULEINSTANCE
        value: MergeHistoricGrids
      - key: FORECASTMODULEINSTANCE
        value: ImportGDPS
      - key: ENSEMBLE
        value: main
    activity:
    - runIndependent: true
      moduleInstanceId: SetForecastLengthGDPS
      moduleConfigFileName: SetForecastLengthTemplate
    - runIndependent: true
      moduleInstanceId: ModifyGDPS
      moduleConfigFileName: ModifyForecastGridsTemplate
    - runIndependent: true
      moduleInstanceId: MergeGDPS
      moduleConfigFileName: MergeForecastGridsDetTemplate
    - properties:
        string:
        - key: MODELINPUTMODULEINSTANCE
          value: MergeGDPS
      runIndependent: true
      moduleInstanceId: $MODELNAME1$GDPSForecast
      moduleConfigFileName: $MODELNAME1$ForecastTemplate
    - properties:
        string:
        - key: TIMESERIESTYPE
