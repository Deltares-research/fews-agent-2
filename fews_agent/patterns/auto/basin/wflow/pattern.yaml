name: wflow_basin
description: 'Auto-derived pattern from tutorial instances: Snare.'
variables:
  basin_name:
    type: str
    required: true
outputs:
- schema: GeneralAdapterRun
  output: ModuleConfigFiles/ModelRun/{{ basin_name }}/{{ basin_name }}ForecastTemplate.xml
  data:
    general:
      rootDir: $REGION_HOME$/Modules
      workDir: '%ROOT_DIR%\wflow'
      exportDir: '%ROOT_DIR%\wflow'
      exportDataSetDir: '%ROOT_DIR%/wflow'
      exportIdMap: IdExportwflow
      importDir: '%ROOT_DIR%'
      importIdMap: IdImportwflow
      dumpFileDir: $GA_DUMPFILEDIR$
      dumpDir: '%ROOT_DIR%\wflow\wflow_snare'
      diagnosticFile: '%ROOT_DIR%/diagnostics.xml'
      missVal: '-999'
      convertDatum: true
      timeZone:
        timeZoneName: $TIMEZONE$
    activities:
      startUpActivities:
        purgeActivity:
        - filter: '%WORK_DIR%/wflow_snare/inmaps/*.nc'
        - filter: '%WORK_DIR%/diagnostics.xml'
        - filter: '%WORK_DIR%/run_info.xml'
        - filter: '%WORK_DIR%/wflow_snare/instate/*.*'
        - filter: '%WORK_DIR%/wflow_snare/intbl/*.*'
        - filter: '%WORK_DIR%/wflow_snare/outstate/*.*'
        - filter: '%WORK_DIR%/wflow_snare/run_default/*.*'
        - filter: '%WORK_DIR%/wflow_snare/run_default/outmaps/*.*'
        - filter: '%WORK_DIR%/wflow_snare/run_default/outsum/*.*'
        - filter: '%WORK_DIR%/wflow_snare/run_default/intbl/*.*'
      exportActivities:
        exportStateActivity:
        - moduleInstanceId: SnareHistoric
          stateExportDir: '%WORK_DIR%/wflow_snare/instate'
          stateConfigFile: '%WORK_DIR%/wflow_snare/instate/states_in.xml'
          stateLocations:
            type: file
            stateLocation:
            - readLocation: DrySnow.map
              writeLocation: DrySnow.map
            - readLocation: FreeWater.map
              writeLocation: FreeWater.map
            - readLocation: InterceptionStorage.map
              writeLocation: InterceptionStorage.map
            - readLocation: LowerZoneStorage.map
              writeLocation: LowerZoneStorage.map
            - readLocation: SoilMoisture.map
              writeLocation: SoilMoisture.map
            - readLocation: SurfaceRunoff.map
              writeLocation: SurfaceRunoff.map
            - readLocation: UpperZoneStorage.map
              writeLocation: UpperZoneStorage.map
            - readLocation: WaterLevel.map
              writeLocation: WaterLevel.map
            - readLocation: ReservoirWaterLevel.map
              writeLocation: ReservoirWaterLevel.map
          stateSelection:
            coldState:
              startDate:
                unit: day
                multiplier: 0
        exportDataSetActivity:
        - moduleInstanceId: $MODELNAME1$
          description: Model Template Export
        exportNetcdfActivity:
        - exportFile: '%WORK_DIR%/wflow_snare/forcing.nc'
          timeSeriesSets:
            timeSeriesSet:
            - moduleInstanceId: $INPUTTIMESERIES$
              valueType: grid
              parameterId: $PARAMETER1$
              locationId: $LOCATION$
              timeSeriesType: $TYPE1$
              timeStep:
                id: $MODEL1_TIMESTEP$
              relativeViewPeriod:
                unit: day
                start: $STARTTIME$
                end: $ENDTIME$
                startOverrulable: true
              readWriteMode: read only
            - moduleInstanceId: $INPUTTIMESERIES$
              valueType: grid
              parameterId: $PARAMETER2$
              locationId: $LOCATION$
              timeSeriesType: $TYPE1$
              timeStep:
                id: $MODEL1_TIMESTEP$
              relativeViewPeriod:
                unit: day
                start: $STARTTIME$
                end: $ENDTIME$
                startOverrulable: true
              readWriteMode: read only
        exportRunFileActivity:
        - exportFile: '%WORK_DIR%/run_info.xml'
      executeActivities:
        executeActivity:
        - description: Run wflow for $MODELNAME1$
          command:
            executable: $WFLOW_EXE$
          arguments:
            argument:
            - -C
            - wflow_snare
            - -s
            - '86400'
            - -R
            - run_default
            - -f
            - run_info.xml
            - -c
            - wflow_hbv.ini
          timeOut: 3600000
          ignoreDiagnostics: true
        - description: Run wflow post
          command:
            executable: $WFLOW_ADAPT_EXE$
          arguments:
            argument:
            - -M
            - Post
            - -s
            - wflow_snare\instate\states_in.xml
            - -o
            - wflow_snare\outstate\states_out.xml
            - -r
            - run_info.xml
            - -w
            - '%WORK_DIR%'
            - -C
            - wflow_snare
            - -I
            - wflow_hbv.ini
          timeOut: 3600000
          ignoreDiagnostics: true
      importActivities:
        importStateActivity:
        - stateConfigFile: '%ROOT_DIR%\wflow\wflow_snare\outstate\states_out.xml'
        importNetcdfActivity:
        - importFile: '%ROOT_DIR%/wflow/wflow_snare/run_default/outmaps.nc'
          timeSeriesSets:
            timeSeriesSet:
            - moduleInstanceId: $OUTPUTTIMESERIES$
              valueType: grid
              parameterId: $PARAMETER4$
              locationId: $OUTPUTGRID$
              timeSeriesType: $TYPE2$
              timeStep:
                id: $MODEL1_TIMESTEP$
              readWriteMode: add originals
            - moduleInstanceId: $OUTPUTTIMESERIES$
              valueType: grid
              parameterId: $PARAMETER5$
              locationId: $OUTPUTGRID$
              timeSeriesType: $TYPE2$
              timeStep:
                id: $MODEL1_TIMESTEP$
              readWriteMode: add originals
            - moduleInstanceId: $OUTPUTTIMESERIES$
              valueType: grid
              parameterId: $PARAMETER6$
              locationId: $OUTPUTGRID$
              timeSeriesType: $TYPE2$
              timeStep:
                id: $MODEL1_TIMESTEP$
              readWriteMode: add originals
            - moduleInstanceId: $OUTPUTTIMESERIES$
              valueType: grid
              parameterId: $PARAMETER7$
              locationId: $OUTPUTGRID$
              timeSeriesType: $TYPE2$
              timeStep:
                id: $MODEL1_TIMESTEP$
              readWriteMode: add originals
            - moduleInstanceId: $OUTPUTTIMESERIES$
              valueType: grid
              parameterId: $PARAMETER8$
              locationId: $OUTPUTGRID$
              timeSeriesType: $TYPE2$
              timeStep:
                id: $MODEL1_TIMESTEP$
              readWriteMode: add originals
