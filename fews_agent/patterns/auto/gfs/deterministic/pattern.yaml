{%- import '_partials/idmap_from_parameters.yaml.j2' as idmap -%}
name: gfs_deterministic
description: 'Auto-derived pattern from tutorial instances: GFS.'
variables:
  # nwp_name, grid_resolution: shared across this family -- see
  # patterns/auto/gfs/variables.yaml.
  # Forecast horizon in hours — when set (e.g. 168 for a 7-day
  # forecast), the SpatialDisplay timeSeriesSet emits a
  # relativeViewPeriod so the plot shows just that window. When unset,
  # `readWriteMode: read complete forecast` keeps today's behaviour
  # (whole available horizon).
  forecast_horizon_hours:
    type: int
    required: false
    default: null
  # Optional list of parameter rows to import. Each entry:
  #   id (FEWS parameterId)
  #   unit (string FEWS expects on the wire)
  #   cumulativeSum (bool, optional — defaults false)
  #   startTimeShiftHours (int, optional — if set, the FIRST parameter
  #     with this value provides the single <startTimeShift> block;
  #     omit for instantaneous parameters like wind / pressure)
  #   external (the idMap external name -- a string, or a list of
  #     strings when NOAA has served this field under more than one
  #     name; the pattern's own IdMap output is generated from this,
  #     so a row can never advertise an id the idMap doesn't back)
  # Default reproduces today's PC.nwp + TA.nwp behaviour so existing
  # blueprints keep emitting identical XML.
  parameters:
    type: list
    required: false
    default:
      - id: PC.nwp
        unit: mm
        cumulativeSum: true
        startTimeShiftHours: -3
        external: [Total_precipitation_surface_6_Hour_Accumulation, apcpsfc]
      - id: TA.nwp
        unit: K
        external: [Temperature_height_above_ground, tmp2m]
  # When true, the pattern contributes one ParameterGroup row per entry
  # in `parameters` to Parameters.xml. The resolver flips this on only
  # when it supplied non-default parameters (because the configurator's
  # data_types slot was filled). Default builds keep emitting the exact
  # same file set as before.
  contribute_parameters:
    type: bool
    required: false
    default: false
# Free-text phrase -> FEWS parameter row, consumed by the resolver when the
# configurator's data_types slot names one of these phrases (e.g. "pressure")
# -- it overwrites this instance's `parameters` above with the matched
# row(s). Declared here, on the pattern itself, so the vocabulary a
# configurator can ask for and the pattern that has to honour it can never
# drift apart. A value is a single {id, unit, ...} dict, or a list of such
# dicts when one phrase means multiple parameters at once.
#
# "wind speed"/"wind direction" and "relative humidity"/"humidity" are
# deliberately NOT offered here (they used to be, as WS10.nwp/WD10.nwp/
# RH.nwp -- with NO idMap backing at all, a real, colleague-reported bug:
# the resulting import could never actually receive data for them). NOAA's
# GFS doesn't serve wind speed/direction or relative humidity as raw
# fields under this DODS/OPeNDAP service, and no real external name for
# them has been verified anywhere in this codebase -- dropping the phrase
# is the honest choice, not guessing one. `mean sea level pressure` and
# `dewpoint` ARE offered: their external names are the same NOAA GFS
# grib-derived naming convention already verified for the same physical
# fields in auto/gfs/gribfilter (Pressure.msl, Tdew.forecast).
data_type_vocabulary:
  precipitation: {id: PC.nwp, unit: mm, cumulativeSum: true, startTimeShiftHours: -3, external: [Total_precipitation_surface_6_Hour_Accumulation, apcpsfc]}
  precip: {id: PC.nwp, unit: mm, cumulativeSum: true, startTimeShiftHours: -3, external: [Total_precipitation_surface_6_Hour_Accumulation, apcpsfc]}
  temperature: {id: TA.nwp, unit: K, external: [Temperature_height_above_ground, tmp2m]}
  air temperature: {id: TA.nwp, unit: K, external: [Temperature_height_above_ground, tmp2m]}
  temp: {id: TA.nwp, unit: K, external: [Temperature_height_above_ground, tmp2m]}
  mean sea level pressure: {id: PA.nwp, unit: hPa, external: Pressure_reduced_to_MSL_msl}
  mslp: {id: PA.nwp, unit: hPa, external: Pressure_reduced_to_MSL_msl}
  pressure: {id: PA.nwp, unit: hPa, external: Pressure_reduced_to_MSL_msl}
  dewpoint temperature: {id: TD.nwp, unit: K, external: Dewpoint_temperature_height_above_ground}
  dew point: {id: TD.nwp, unit: K, external: Dewpoint_temperature_height_above_ground}
  dewpoint: {id: TD.nwp, unit: K, external: Dewpoint_temperature_height_above_ground}
outputs:
- schema: TimeSeriesImportRun
  output: ModuleConfigFiles/Import/NOAA/Import{{ nwp_name }}.xml
  data:
    import:
    - general:
        importType: NETCDF-CF_GRID
        serverUrl: https://nomads.ncep.noaa.gov:9090/dods/gfs_{{ grid_resolution }}/gfs%TIME_ZERO(yyyyMMdd)%/gfs_{{ grid_resolution }}_%TIME_ZERO(HH)%z
        idMapId: IdImportGFS
        unitConversionsId: ImportUnitConversions
        missingValue: -3.402823E38
        importTimeZone:
          timeZoneName: GMT
        dataFeedId: GFS.Server
{% set shifted = (parameters | selectattr('startTimeShiftHours', 'defined') | list) %}
{% if shifted %}
      startTimeShift:
        parameterId: {{ shifted[0].id }}
        relativePeriod:
          unit: hour
          start: {{ shifted[0].startTimeShiftHours }}
          end: 0
{% endif %}
      timeSeriesSet:
{% for p in parameters %}
      - moduleInstanceId: ImportGFS
        valueType: grid
        parameterId: {{ p.id }}
        locationId: GFS
        timeSeriesType: external forecasting
        timeStep:
          unit: hour
          multiplier: 3
        readWriteMode: add originals
        synchLevel: 6
{% endfor %}
      externUnit:
{% for p in parameters %}
      - parameterId: {{ p.id }}
        unit: {{ p.unit }}
{% if p.get('cumulativeSum') %}
        cumulativeSum: true
{% endif %}
{% endfor %}
- schema: Workflow
  output: WorkflowFiles/Import/NOAA/Import{{ nwp_name }}Grids.xml
  data:
    version: '1.1'
    activity:
    - runIndependent: true
      moduleInstanceId: ImportGFS
{{ idmap.emit(output_path='IdMapFiles/NOAA/IdImport' ~ nwp_name ~ '.xml', parameters=parameters) }}
{% if contribute_parameters %}
contributions:
  - target: Parameters
    field: parameterGroup
    items:
{% for p in parameters %}
      - id: nwp_{{ p.id }}
        parameterType: instantaneous
        unit: {{ p.unit }}
        parameter:
          - id: {{ p.id }}
            shortName: {{ p.id }}
{% endfor %}
  # Spatial Display panel for this NWP source: one gridPlot per
  # imported parameter. Picks a Class.Precipitation / Class.Temperature
  # break only for the obvious PC.*/TA.* ids; other parameters render
  # without classBreaksId (XSD allows it as optional). The configurator
  # can drop in their own classBreaksId per parameter later.
  - target: SpatialDisplay
    field: body
    items:
      - gridPlotGroup:
          '@id': {{ nwp_name }}_Forecast
          '@name': '{{ nwp_name }} Forecast'
          gridPlot:
{% for p in parameters %}
          - '@id': '{{ nwp_name }}_{{ p.id }}'
            '@name': '{{ p.id }}'
            timeSeriesSet:
              moduleInstanceId: Import{{ nwp_name }}
              valueType: grid
              parameterId: {{ p.id }}
              locationId: {{ nwp_name }}
              timeSeriesType: external forecasting
              timeStep:
                '@unit': hour
                '@multiplier': '3'
{% if forecast_horizon_hours %}
              relativeViewPeriod:
                '@unit': hour
                '@start': '0'
                '@end': '{{ forecast_horizon_hours }}'
{% endif %}
              readWriteMode: read complete forecast
            showThumbnailsPanel: 'true'
            numberOfRecentForecasts: '3'
{% if p.id.startswith('PC') %}
            classBreaksId: Class.Precipitation
{% elif p.id.startswith('TA') %}
            classBreaksId: Class.Temperature
{% endif %}
{% endfor %}
{% else %}
contributions: []
{% endif %}
