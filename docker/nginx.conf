# Single-port front for the two in-container processes:
#   /api/*  -> FastAPI (uvicorn, 127.0.0.1:8000)  [prefix stripped]
#   /*      -> Streamlit (127.0.0.1:8601)          [websocket-aware]
# App Service exposes ONE port (WEBSITES_PORT=8501); Entra Easy Auth sits in
# front of it, so BOTH surfaces require an authenticated caller.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    access_log off;
    client_max_body_size 64m;          # inputs uploads (CSVs, shapefiles)

    server {
        listen 8501;

        location /api/ {
            proxy_pass http://127.0.0.1:8000/;      # trailing / strips /api
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 600s;                # builds can take a while
        }

        location / {
            proxy_pass http://127.0.0.1:8601;
            proxy_http_version 1.1;                 # Streamlit websocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }
    }
}
